# Response headers for the Amplify site. The browser may only talk to this site,
# the TagFluent API, Cognito's sign-in API and Google Analytics' read APIs.
customHeaders:
  - pattern: '**/*'
    headers:
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.execute-api.us-east-2.amazonaws.com https://cognito-idp.us-east-2.amazonaws.com https://*.auth.us-east-2.amazoncognito.com https://analyticsdata.googleapis.com https://analyticsadmin.googleapis.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://*.auth.us-east-2.amazoncognito.com"
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
  - pattern: 'assets/**'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
