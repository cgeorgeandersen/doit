AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  UTMDM's backend: Cognito sign-in, and a DynamoDB table of each user's
  workspace behind an API that only accepts signed-in requests. The site itself
  is an Amplify app connected to GitHub (amplify.yml). Deployed by
  scripts/deploy-infra.sh, which inlines infra/api.js as the Lambda code.

Parameters:
  DemoEmail:
    Type: String
    Default: cgeorgeandersen@outlook.com
    Description: Where "Book a demo" requests are emailed (the address confirms an SNS subscription once).
  AppName:
    Type: String
    Default: utmdm
  AppOrigin:
    Type: String
    Description: The site's address without a trailing slash, e.g. https://main.d1234.amplifyapp.com
    AllowedPattern: https://[^/]+
  LocalDevUrl:
    Type: String
    Default: http://localhost:5173/
    Description: Where `npm run dev` serves the app, so sign-in also works locally.

Resources:
  # ── sign-in ───────────────────────────────────────────────────────────
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AppName}-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Schema:
        - Name: email
          Required: true
          Mutable: true
      DeletionProtection: ACTIVE
      LambdaConfig:
        PostConfirmation: !GetAtt ApprovalFunction.Arn
        CustomMessage: !GetAtt EmailFunction.Arn
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub ${AppName}-${AWS::AccountId}
      UserPoolId: !Ref UserPool

  WebClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub ${AppName}-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false # a browser can't keep a secret; the code flow with PKCE protects it instead
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs:
        - !Sub ${AppOrigin}/
        - !Ref LocalDevUrl
      LogoutURLs:
        - !Sub ${AppOrigin}/
        - !Ref LocalDevUrl
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH] # TagFluent's own sign-in page
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  # ── account approval (new sign-ups wait until the owner enables them) ───
  ApprovalRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: disable-new-users
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cognito-idp:AdminDisableUser
                # By pattern, not !GetAtt UserPool.Arn: the pool refers to this function, so naming it here would be circular.
                Resource: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref DemoTopic

  ApprovalFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AppName}-approve-signup
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt ApprovalRole.Arn
      MemorySize: 128
      Timeout: 10
      Environment:
        Variables:
          TOPIC: !Ref DemoTopic
      Code:
        ZipFile: __APPROVE_CODE__

  ApprovalLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AppName}-approve-signup
      RetentionInDays: 30

  ApprovalPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApprovalFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt UserPool.Arn

  # ── branded emails (Cognito asks this for every sign-up and password email) ──
  EmailRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  EmailFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AppName}-emails
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt EmailRole.Arn
      MemorySize: 128
      Timeout: 5
      Code:
        ZipFile: __EMAILS_CODE__

  EmailLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AppName}-emails
      RetentionInDays: 30

  EmailPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref EmailFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt UserPool.Arn

  # ── data ──────────────────────────────────────────────────────────────
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AppName}-workspaces
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      DeletionProtectionEnabled: true
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

  # ── API ───────────────────────────────────────────────────────────────
  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: workspace-table
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:Query, dynamodb:PutItem, dynamodb:BatchWriteItem]
                Resource: !GetAtt Table.Arn

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AppName}-api
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt ApiRole.Arn
      MemorySize: 256
      Timeout: 15
      Environment:
        Variables:
          TABLE: !Ref Table
      Code:
        ZipFile: __API_CODE__

  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AppName}-api
      RetentionInDays: 30

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${AppName}-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Ref AppOrigin
          - https://tagfluent.com
          - https://www.tagfluent.com
          - http://localhost:5173
        AllowMethods: [GET, POST, PUT, OPTIONS]
        AllowHeaders: [authorization, content-type]
        MaxAge: 600

  Authorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      Name: cognito
      AuthorizerType: JWT
      IdentitySource: [$request.header.Authorization]
      JwtConfiguration:
        Issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
        Audience: [!Ref WebClient]

  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: '2.0'

  GetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /workspace
      AuthorizationType: JWT
      AuthorizerId: !Ref Authorizer
      Target: !Sub integrations/${Integration}

  AppendRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /workspace/changes
      AuthorizationType: JWT
      AuthorizerId: !Ref Authorizer
      Target: !Sub integrations/${Integration}

  ReplaceRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: PUT /workspace
      AuthorizationType: JWT
      AuthorizerId: !Ref Authorizer
      Target: !Sub integrations/${Integration}

  # ── demo requests (the home page's "Book a demo" form, no sign-in) ───────
  DemoTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${AppName}-demo-requests
      DisplayName: TagFluent demo requests

  DemoSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref DemoTopic
      Protocol: email
      Endpoint: !Ref DemoEmail

  DemoRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: demo-topic
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref DemoTopic

  DemoFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AppName}-demo-request
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt DemoRole.Arn
      MemorySize: 128
      Timeout: 10
      Environment:
        Variables:
          TOPIC: !Ref DemoTopic
      Code:
        ZipFile: __DEMO_CODE__

  DemoLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AppName}-demo-request
      RetentionInDays: 30

  DemoIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt DemoFunction.Arn
      PayloadFormatVersion: '2.0'

  DemoRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /demo-request
      AuthorizationType: NONE
      Target: !Sub integrations/${DemoIntegration}

  DemoInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DemoFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    DependsOn: DemoRoute
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 20
      RouteSettings:
        POST /demo-request:
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 1

  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

Outputs:
  DemoTopicArn:
    Value: !Ref DemoTopic
  ApiUrl:
    Value: !GetAtt HttpApi.ApiEndpoint
  UserPoolId:
    Value: !Ref UserPool
  ClientId:
    Value: !Ref WebClient
  AuthDomain:
    Value: !Sub https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
