<title>CONA AI Portal</title>
<style>
:root{
  color-scheme:light;
  --red:#E4002B; --red-dark:#B3001F; --red-tint:#FDECEF;
  --black:#111111; --ink:#1E1E1E; --ink-2:#3D3D3D; --grey:#6B6B6B;
  --line:#E2E2E2; --line-2:#C9C9C9; --soft:#F5F5F5; --white:#FFFFFF;
  --font:Arial,"Helvetica Neue",Helvetica,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--white)}
body{color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55}
h1,h2,h3,h4{font-family:var(--font);color:var(--black);margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:clamp(30px,4.4vw,44px);font-weight:700;letter-spacing:-.02em}
h2{font-size:clamp(24px,3vw,30px);font-weight:700;letter-spacing:-.01em}
h3{font-size:18px;font-weight:700}
p{margin:0}
input,select,textarea,button{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--black);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--grey)}
.small{font-size:13px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--white);border-bottom:1px solid var(--line)}
.top::before{content:"";display:block;height:4px;background:var(--red)}
.top-in{max-width:1160px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:6px 24px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:12px 0;text-align:left}
.logo .dot{width:30px;height:30px;border-radius:50%;background:var(--red);color:var(--white);font-weight:700;font-size:13px;display:grid;place-items:center;letter-spacing:.02em}
.logo b{display:block;font-size:17px;color:var(--black)}
.logo span{display:block;font-size:12px;color:var(--grey)}
nav.menu{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none;max-width:100%}
nav.menu::-webkit-scrollbar{display:none}
nav.menu button{background:none;border:0;border-bottom:3px solid transparent;padding:18px 12px 15px;font-weight:700;font-size:14px;color:var(--ink-2);white-space:nowrap}
nav.menu button:hover{color:var(--black)}
nav.menu button[aria-current="page"]{color:var(--black);border-bottom-color:var(--red)}

.page{max-width:1160px;margin:0 auto;padding-inline:16px;padding-block:32px 80px}
.view{display:flex;flex-direction:column;gap:28px}
.view[hidden]{display:none!important}
.head{display:flex;flex-direction:column;gap:10px;max-width:70ch}
.head p:not(.eyebrow){font-size:17px;color:var(--ink-2)}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:4px;border:1.5px solid var(--black);background:var(--white);color:var(--black);padding:9px 16px;font-weight:700;font-size:14px;line-height:1.2;text-decoration:none}
.btn:hover{background:var(--soft)}
.btn.red{background:var(--red);border-color:var(--red);color:var(--white)}
.btn.red:hover{background:var(--red-dark);border-color:var(--red-dark)}
.btn.dark{background:var(--black);color:var(--white)}
.btn.dark:hover{background:#333}
.btn.plain{border-color:transparent;background:none;color:var(--ink-2);padding-inline:8px}
.btn.plain:hover{color:var(--black);text-decoration:underline}
.btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row .push{margin-left:auto}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-weight:700;font-size:14px;color:var(--black)}
.field .hint{font-size:13px;color:var(--grey);margin-top:-2px}
.field input,.field select,.field textarea{border:1px solid var(--line-2);border-radius:4px;background:var(--white);padding:9px 11px;font-size:15px;width:100%;min-width:0}
.field textarea{resize:vertical;min-height:76px;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--black);box-shadow:0 0 0 3px rgba(17,17,17,.12)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.box{border:1px solid var(--line);border-radius:6px;background:var(--white);padding:20px;display:flex;flex-direction:column;gap:12px}
.box.grey{background:var(--soft);border-color:var(--soft)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--black);color:var(--white);padding:10px 16px;border-radius:4px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:calc(100% - 32px)}
.toast.on{opacity:1}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;align-items:center;padding-bottom:8px}
.hero p.lead{font-size:18px;color:var(--ink-2);max-width:56ch;margin-top:14px}
.hero .progress-card{background:var(--black);color:var(--white);border-radius:6px;padding:22px;display:flex;flex-direction:column;gap:12px}
.progress-card h3{color:var(--white);font-size:16px}
.progress-card .big{font-size:40px;font-weight:700;line-height:1}
.progress-card .bar{height:8px;background:#3a3a3a;border-radius:4px;overflow:hidden}
.progress-card .bar i{display:block;height:100%;background:var(--red)}
.progress-card p{color:#cfcfcf;font-size:14px}
.cards4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.door{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--white);border:1px solid var(--line);border-top:4px solid var(--black);border-radius:6px;padding:18px}
.door:hover{border-color:var(--line-2);border-top-color:var(--red)}
.door .when{font-size:13px;color:var(--grey)}
.door h3{font-size:19px}
.door p{font-size:14.5px;color:var(--ink-2)}
.door .go{margin-top:auto;font-weight:700;color:var(--red);font-size:14px}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;border-top:1px solid var(--line);padding-top:24px}
.rules h4{font-size:16px;margin-bottom:6px}
.rules p{font-size:14.5px;color:var(--ink-2)}
.leaders{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;background:var(--red-tint);border-radius:6px;padding:18px 20px}
.leaders p{max-width:62ch;color:var(--ink-2)}

/* learn */
.learn{display:grid;grid-template-columns:280px minmax(0,1fr);gap:28px;align-items:start}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);display:flex;flex-direction:column;gap:4px}
.toc .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--grey);padding:0 10px 6px}
.toc button{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:center;text-align:left;background:none;border:0;border-radius:4px;padding:9px 10px;font-size:14.5px;color:var(--ink-2)}
.toc button:hover{background:var(--soft)}
.toc button[aria-current="true"]{background:var(--soft);color:var(--black);font-weight:700}
.toc .n{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--grey)}
.toc .done .n{background:var(--black);border-color:var(--black);color:var(--white)}
.toc hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.lesson{display:flex;flex-direction:column;gap:22px;min-width:0}
.lesson .meta{font-size:13px;color:var(--grey)}
.lesson .why{font-size:18px;color:var(--ink-2);max-width:64ch}
.points{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;max-width:70ch}
.points li{display:grid;grid-template-columns:18px 1fr;gap:10px}
.points li::before{content:"";width:8px;height:8px;background:var(--red);margin-top:8px}
.points b{color:var(--black)}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.compare .side{border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:8px}
.compare .weak{background:var(--soft)}
.compare .strong{background:var(--white);border:2px solid var(--black)}
.compare .tag{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.compare .weak .tag{color:var(--grey)}
.compare .strong .tag{color:var(--red)}
.compare pre,.prompt pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--font);font-size:14px;line-height:1.55}
.compare .note{font-size:13.5px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:8px}
.prompt{border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.prompt .ph{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--soft);padding:8px 12px;border-bottom:1px solid var(--line)}
.prompt .ph span{font-size:13px;font-weight:700}
.prompt pre{padding:14px;max-height:380px;overflow:auto}
.prompt mark{background:var(--red-tint);color:var(--red-dark);padding:0 2px;border-radius:2px}
.quiz{border-left:4px solid var(--black);padding:4px 0 4px 18px;display:flex;flex-direction:column;gap:10px}
.quiz .q{font-weight:700;font-size:16px;color:var(--black)}
.quiz .opts{display:flex;flex-direction:column;gap:8px}
.quiz .opt{text-align:left;background:var(--white);border:1px solid var(--line-2);border-radius:4px;padding:10px 12px;font-size:14.5px}
.quiz .opt:hover{border-color:var(--black)}
.quiz .opt.right{border:2px solid var(--black);background:var(--soft);font-weight:700}
.quiz .opt.wrong{border-color:var(--red);color:var(--red-dark);background:var(--red-tint)}
.quiz .fb{font-size:14.5px;color:var(--ink-2)}
.lesson-nav{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:18px;flex-wrap:wrap}
.plan{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.plan li{display:grid;grid-template-columns:90px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.plan li:last-child{border-bottom:0}
.plan .t{font-weight:700;color:var(--red);font-variant-numeric:tabular-nums}
.plan b{display:block;color:var(--black);margin-bottom:2px}
.cheat{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.cheat .box h3{font-size:16px}
.cheat ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:14.5px}

/* prompts */
.filterbar{display:flex;flex-direction:column;gap:12px}
.search{width:100%;max-width:520px;border:1.5px solid var(--black);border-radius:4px;padding:11px 14px;font-size:16px}
.search:focus{outline:none;box-shadow:0 0 0 3px rgba(17,17,17,.12)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--white);border:1px solid var(--line-2);border-radius:999px;padding:5px 12px;font-size:13.5px}
.chip:hover{border-color:var(--black)}
.chip[aria-pressed="true"]{background:var(--black);border-color:var(--black);color:var(--white)}
.plist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.pitem{border-bottom:1px solid var(--line)}
.pitem>button{width:100%;background:none;border:0;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:16px 4px;align-items:baseline}
.pitem>button:hover h3{color:var(--red)}
.pitem h3{font-size:17px}
.pitem .who{grid-column:1;font-size:13px;color:var(--grey)}
.pitem .saves{grid-row:1;grid-column:2;font-size:13px;color:var(--ink-2);white-space:nowrap}
.pitem .body{display:none;flex-direction:column;gap:14px;padding:0 4px 22px}
.pitem.open .body{display:flex}
.pitem.open>button h3{color:var(--red)}
.pitem .what{max-width:72ch;color:var(--ink-2)}
.checknote{display:grid;grid-template-columns:auto 1fr;gap:12px;background:var(--soft);border-radius:4px;padding:12px 14px;font-size:14.5px}
.checknote b{color:var(--red);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px}
.empty{padding:40px 16px;text-align:center;color:var(--grey);border:1px dashed var(--line-2);border-radius:6px}

/* idea check */
.check-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:start}
.qs{display:flex;flex-direction:column;gap:22px;min-width:0}
.qq{display:flex;flex-direction:column;gap:8px}
.qq .t{font-weight:700;font-size:16px;color:var(--black)}
.qq .t span{color:var(--red);margin-right:8px;font-variant-numeric:tabular-nums}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.choice{display:flex;align-items:flex-start;gap:9px;border:1px solid var(--line-2);border-radius:4px;padding:10px 12px;font-size:14.5px;cursor:pointer;background:var(--white)}
.choice:hover{border-color:var(--black)}
.choice input{accent-color:var(--black);margin-top:3px;flex:none}
.choice.on{border:2px solid var(--black);padding:9px 11px;background:var(--soft)}
.check-side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);display:flex;flex-direction:column;gap:12px}
.verdict{border-radius:6px;padding:20px;background:var(--soft);display:flex;flex-direction:column;gap:10px}
.verdict.go{background:var(--black);color:var(--white)}
.verdict.go h3,.verdict.go .lbl{color:var(--white)}
.verdict.stop{background:var(--red);color:var(--white)}
.verdict.stop h3,.verdict.stop .lbl{color:var(--white)}
.verdict .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--grey)}
.verdict h3{font-size:22px}
.verdict p{font-size:14.5px}
.reasons{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.reasons li{display:grid;grid-template-columns:14px 1fr;gap:10px;font-size:14.5px}
.reasons li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red);margin-top:7px}
.reasons li.ok::before{background:var(--black)}
.reasons b{display:block;color:var(--black)}
.stat{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;font-size:14px}
.stat b{font-variant-numeric:tabular-nums}

/* brief builder */
.briefs-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.briefs-top select{border:1px solid var(--line-2);border-radius:4px;padding:8px 10px;font-size:14px;max-width:100%;min-width:0;flex:0 1 360px}
.builder{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
.form{display:flex;flex-direction:column;gap:26px;min-width:0}
.form section{display:flex;flex-direction:column;gap:14px}
.form h3{display:flex;gap:10px;align-items:baseline;border-bottom:2px solid var(--black);padding-bottom:6px}
.form h3 span{color:var(--red);font-size:14px}
.minirow{display:grid;grid-template-columns:minmax(0,1fr) 120px 34px;gap:8px;align-items:center}
.minirow.r3{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 34px}
.minirow input{border:1px solid var(--line-2);border-radius:4px;padding:8px 10px;font-size:14.5px;width:100%;min-width:0}
.minirow input:focus{outline:none;border-color:var(--black)}
.x{background:none;border:0;font-size:20px;line-height:1;color:var(--grey);border-radius:4px;padding:4px}
.x:hover{color:var(--red);background:var(--red-tint)}
.moneyrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.preview-col{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 100px);overflow:auto;padding-bottom:4px}
.paper{background:var(--white);border:1px solid var(--line-2);box-shadow:0 2px 14px rgba(0,0,0,.08);padding:30px 32px;display:flex;flex-direction:column;gap:16px;font-size:14px;line-height:1.5}
.paper .rule{height:4px;background:var(--red);margin:-30px -32px 6px}
.paper .kicker{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--grey)}
.paper h2{font-size:24px}
.paper .by{font-size:12.5px;color:var(--grey)}
.paper .ask{border-left:4px solid var(--red);background:var(--soft);padding:12px 14px}
.paper .ask b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);margin-bottom:3px}
.paper .ask p{font-size:15px;color:var(--black);font-weight:700}
.paper h4{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--black);border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:6px}
.paper .blank{color:#A0A0A0;font-style:italic}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line)}
.nums div{padding:9px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:1px}
.nums div:nth-child(3n){border-right:0}
.nums div:nth-last-child(-n+3){border-bottom:0}
.nums span{font-size:11px;color:var(--grey)}
.nums b{font-size:17px;font-variant-numeric:tabular-nums;color:var(--black)}
.nums b.neg{color:var(--red)}
.paper ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.tl{display:flex;flex-direction:column;gap:4px}
.tl div{display:grid;grid-template-columns:78px 1fr;gap:10px}
.tl span{font-weight:700;color:var(--black);font-variant-numeric:tabular-nums}
.foot-note{font-size:11px;color:var(--grey);border-top:1px solid var(--line);padding-top:8px}
.review{display:flex;flex-direction:column;gap:8px}
.review .score{display:flex;align-items:baseline;gap:10px}
.review .score b{font-size:28px;font-variant-numeric:tabular-nums}
.review ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.review li{display:grid;grid-template-columns:14px 1fr;gap:10px;font-size:14px}
.review li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red);margin-top:6px}
.review li.ok::before{background:var(--black)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--red-tint);border-radius:4px;padding:10px 12px;font-size:14px}

.foot{border-top:1px solid var(--line);padding-top:16px;font-size:13px;color:var(--grey)}

@media (max-width:1000px){
  .cards4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .learn,.check-wrap,.builder{grid-template-columns:1fr}
  .toc,.check-side,.preview-col{position:static;max-height:none}
  .hero{grid-template-columns:1fr}
}
@media (max-width:640px){
  .cards4,.rules{grid-template-columns:1fr}
  .choices{grid-template-columns:1fr}
  .plan li{grid-template-columns:1fr;gap:4px}
  .paper{padding:22px 18px}
  .paper .rule{margin:-22px -18px 6px}
  .nums{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nums div{border-right:1px solid var(--line)!important;border-bottom:1px solid var(--line)!important}
  .minirow{grid-template-columns:minmax(0,1fr) 90px 34px}
  .minirow.r3{grid-template-columns:1fr 34px}
  .minirow.r3 input:nth-child(2){grid-column:1}
  nav.menu button{padding:12px 9px 11px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== v3 additions ===== */
.banner{background:var(--soft);border-left:4px solid var(--black);padding:10px 14px;font-size:14px;border-radius:0 4px 4px 0}
.banner.red{border-left-color:var(--red);background:var(--red-tint)}
.welcome{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.level{background:var(--black);color:var(--white);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:12px}
.level h3,.level b{color:var(--white)}
.level .lv{display:flex;gap:6px}
.level .lv i{flex:1;height:8px;border-radius:4px;background:#3a3a3a}
.level .lv i.on{background:var(--red)}
.level .name{font-size:26px;font-weight:700;line-height:1.1}
.level ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px;color:#d6d6d6}
.level li{display:grid;grid-template-columns:18px 1fr;gap:8px}
.level li::before{content:"○";color:#8a8a8a}
.level li.ok::before{content:"✓";color:var(--white)}
.level li.ok{color:#8a8a8a;text-decoration:line-through}
.challenge{border:2px solid var(--black);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:10px}
.challenge .wk{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
.challenge h3{font-size:20px}
.pulse{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:6px;overflow:hidden}

<script>
"use strict";
/* ============================================================
   LESSONS
   ============================================================ */
const LESSONS=[
{id:"good-at",title:"What it's good at, and what it isn't",mins:5,
 why:"The quickest way to get value is to use AI for the jobs it's good at. The quickest way to get burned is to use it for the others.",
 points:[
  "<b>Think of it as a smart new hire who has never worked here.</b> Well read, fast, happy to draft anything. It doesn't know our customers, our systems or last week's decision unless you tell it.",
  "<b>It's good with words.</b> Drafting, rewriting, summarising, explaining, pulling structure out of messy notes, comparing two documents, brainstorming options.",
  "<b>It's bad at exact numbers and facts it wasn't given.</b> It can add up a column wrong and sound completely sure. It can invent a policy clause, a statistic or a quote.",
  "<b>It won't give the same answer twice.</b> Ask again and you'll get a different version. That's fine for a draft. It's a problem for anything that has to be exactly repeatable."],
 compare:{weak:{tag:"Poor use",text:"Here's our sales export for Q3. What's the total volume by region?",note:"It may get the sums wrong, and you won't know. Use a pivot table."},
          strong:{tag:"Good use",text:"Here's our Q3 volume by region (totals from the pivot table). Write three sentences for the ops review explaining what changed from Q2. Use only these numbers.",note:"Excel does the maths. AI does the writing. You check both."}},
 tryit:"Pick one thing you did this week that was mostly reading or writing: an email thread, a report, meeting notes. Paste it into an approved tool and ask: “What are the three most important points here, and what's missing?” Then judge the answer yourself.",
 quiz:{q:"You need the total of a 400-row column for a report. What's the best move?",
  opts:["Paste the column into the AI tool and ask for the total","Use SUM in Excel, and ask AI to explain the formula if you get stuck","Ask the AI tool twice and use the answer if both match"],
  right:1,fb:["It can add up hundreds of numbers wrong and sound certain. Excel won't.","Right. Use the right tool for the maths, and AI for the bits around it.","Two wrong answers can match. For exact numbers, use a spreadsheet."]}},

{id:"briefing",title:"Ask the way you'd brief a colleague",mins:5,
 why:"Most bad answers come from short questions. If you'd give a colleague more context, give the AI more context too.",
 points:[
  "<b>Say who it's for.</b> “For the VP of Sales, who'll read it on their phone” gets a very different answer from no audience at all.",
  "<b>Say what you want done.</b> Draft, shorten, compare, list, explain. One clear verb.",
  "<b>Give it the material.</b> Paste the email, the notes, the table. Don't make it guess.",
  "<b>Say what good looks like.</b> Length, format, tone. “Under 120 words, three bullets, no jargon.”",
  "<b>If you have an example you like, paste it.</b> “Write it like this one” beats any description of a style."],
 compare:{weak:{tag:"Short question",text:"Write an email about the export delay.",note:"You'll get a generic apology letter you have to rewrite."},
          strong:{tag:"Proper brief",text:"Write an email to our main contact at [customer]. Their data export scheduled for Tuesday will now run Thursday because a migration failed overnight. We've run their three most-used reports manually so they aren't blocked. Firm and factual, one apology, under 120 words. End by offering a call tomorrow.",note:"Everything it needs is there. You'll mostly just check it and send."}},
 tryit:"Take an email you need to write today. Before asking for a draft, write two lines: who it's for and what they need to do after reading it. Put those at the top of your prompt.",
 quiz:{q:"Which prompt will get the most useful first draft?",
  opts:["“Summarise this.”","“Summarise this thread for my director in five bullets: the decision needed, the options, and who disagrees.”","“Please could you kindly summarise this long thread as best you can?”"],
  right:1,fb:["It will summarise, but not for anyone in particular, so it'll be too long or miss what matters.","Right. Audience, length and what to focus on.","Politeness doesn't hurt, but it doesn't tell it what you need."]}},

{id:"source",title:"Give it the facts. Don't ask it to remember them.",mins:5,
 why:"When it doesn't have the facts, it fills the gap with something that sounds right. Paste the source, and tell it to stay inside it.",
 points:[
  "<b>Paste the actual document.</b> The policy, the contract, the spec. Don't ask “what's our travel policy?” It doesn't know ours.",
  "<b>Tell it to use only what you gave it.</b> “Answer using only the text below.”",
  "<b>Ask for quotes.</b> “Quote the sentence you're relying on” makes it easy to check, and it's less likely to make things up.",
  "<b>Give it a way out.</b> “If the document doesn't say, tell me.” Otherwise it will try to be helpful and guess."],
 compare:{weak:{tag:"Asking it to remember",text:"Can I expense a client dinner over $150?",note:"It will answer from generic company policies that aren't ours."},
          strong:{tag:"Giving it the source",text:"Using only the expense policy below, can I expense a client dinner for four people at $190? Quote the clause you're relying on. If the policy doesn't cover it, say so.\n\n[paste policy]",note:"Now you can check the quote in ten seconds."}},
 tryit:"Find a policy or long document you've had to search through recently. Paste it in with a real question, and add “quote the sentence you're relying on, and say if it isn't covered.” Check the quote.",
 quiz:{q:"The AI gives you a confident answer about a policy, with a clause number. What do you do?",
  opts:["Use it. It gave a clause number, so it's clearly checked","Open the policy and read that clause before relying on it","Ask the AI whether it's sure"],
  right:1,fb:["Clause numbers can be invented too. They look official, which makes this worse.","Right. It takes a minute and it's the only real check.","It will almost always say yes. That's not a check."]}},

{id:"checking",title:"Check it before it leaves your hands",mins:5,
 why:"AI writes fluently even when it's wrong. Your name goes on what you send, so the check is your job.",
 points:[
  "<b>Check every number, name and date against the source.</b> These are the most common errors and the most embarrassing.",
  "<b>Read for what's missing, not just what's wrong.</b> Summaries quietly drop the awkward bit. Ask it: “What did you leave out?”",
  "<b>Check the tone.</b> It tends to over-apologise, over-promise and pad. Cut anything you wouldn't say out loud.",
  "<b>Be most careful where you know least.</b> If you couldn't spot a wrong answer, get someone who can to look before it goes anywhere."],
 compare:{weak:{tag:"Risky",text:"Draft is good. Sending it to the customer now.",note:"The draft promised a credit nobody approved."},
          strong:{tag:"Safe",text:"Reading it once for facts (dates, volumes, names), once for promises (did it commit us to anything?), once for tone.",note:"Three quick passes. About two minutes."}},
 tryit:"Next time you use AI for something that goes to another person, do the three passes: facts, promises, tone. Notice what you'd have missed.",
 quiz:{q:"A draft customer email looks great. What's the most likely hidden problem?",
  opts:["A spelling mistake","A promise or detail that isn't true, like a date or a credit nobody approved","It's too short"],
  right:1,fb:["It rarely misspells. The bigger risk is elsewhere.","Right. Invented details and extra promises are the classic failure.","Length is easy to see. The risk is the thing you don't see."]}},

{id:"data",title:"What's safe to paste",mins:5,
 why:"Most people never have a problem here. The ones who do usually pasted something into a tool that wasn't approved for it.",
 points:[
  "<b>The company AI policy is the final word.</b> This lesson covers the common-sense basics. If they ever disagree, the policy wins.",
  "<b>Use only approved tools for work.</b> A personal account on a public AI site is not the same as the company's approved tool, even if it looks the same.",
  "<b>Be careful with anything personal or sensitive.</b> Customer details, employee information, passwords, unreleased financials, and anything under NDA. Don't paste it unless you know the tool is approved for that kind of data.",
  "<b>When in doubt, strip it out.</b> Replace names and account numbers with placeholders like [Customer A]. The AI rarely needs the real ones to help you.",
  "<b>Ask if you're unsure.</b> A quick question to your manager or the AI team is much cheaper than fixing a leak."],
 compare:{weak:{tag:"Risky",text:"[Pastes a full employee spreadsheet with names, salaries and home addresses into a public chatbot] Which of these people are paid below band?",note:"Personal data in an unapproved tool. Don't."},
          strong:{tag:"Safer",text:"Here's a list of salaries and pay bands with names replaced by Employee 1, 2, 3. Write the Excel formula that flags anyone below the minimum of their band.",note:"It gets what it needs to help. The personal data stays with you."}},
 tryit:"Find out which AI tools are approved for your work, and bookmark them. If you don't know, ask your manager this week. It's the one lesson where the answer is specific to us.",
 quiz:{q:"You want help with a customer complaint email that includes the customer's name and account number. What's the safest approach?",
  opts:["Paste it into whichever AI site is quickest","Use an approved tool, and replace the name and account number with placeholders if they aren't needed","Don't use AI for anything customer-related, ever"],
  right:1,fb:["Speed isn't worth it. Unapproved tools are the main way data leaks.","Right. Approved tool, and only the detail it actually needs.","That's more cautious than you need to be. Approved tools and placeholders make most of this fine."]}},

{id:"habit",title:"Make it part of your week",mins:5,
 why:"People who get real value from AI didn't try everything once. They picked one or two tasks and got good at them.",
 points:[
  "<b>Pick one task you do every week.</b> Status report, meeting notes, the Monday email. Use AI on it for a month.",
  "<b>Treat the first answer as a first draft.</b> Follow up: “shorter”, “more direct”, “what did you leave out?”, “give me two other options.” The second or third answer is usually the good one.",
  "<b>Save prompts that work.</b> Keep a note of your best prompts, with the blanks marked. Next week it takes seconds.",
  "<b>Share what works.</b> Send your best prompt to one colleague. Teams improve fastest when people swap what works.",
  "<b>When a task needs more than a prompt, say so.</b> If the same job could be improved for the whole team, start a project on the Projects page."],
 compare:{weak:{tag:"One-off",text:"Tried AI once on a hard problem, got a vague answer, gave up.",note:"Hard, unusual problems are the worst place to start."},
          strong:{tag:"Habit",text:"Every Friday: paste the week's notes, use my saved status-report prompt, check it, send it. Saves about an hour.",note:"Small, repeated and easy to check."}},
 tryit:"Choose your one weekly task now. Find a matching prompt in the prompt library, save it somewhere you'll see it, and use it the next time the task comes round.",
 quiz:{q:"The first answer isn't quite right. What usually works best?",
  opts:["Start a new chat and ask the same question again","Tell it what's wrong: “too formal, cut it by half, lead with the decision”","Give up and write it yourself"],
  right:1,fb:["You'll get another random version. Telling it what to fix is faster.","Right. Specific feedback gets you there in one or two rounds.","Sometimes that's right, but one round of feedback usually fixes it."]}},

{id:"principles",title:"Microsoft's six principles, in plain words",mins:6,
 why:"We follow Microsoft's six responsible AI principles. They aren't just for developers. Each one turns into a plain question you can ask about anything you do with AI.",
 points:[
  "<b>Fairness.</b> Could this treat someone differently because of who they are? Be most careful with anything that touches hiring, pay, performance or a customer's terms.",
  "<b>Reliability and safety.</b> What happens when it's wrong? If you can't catch a mistake before it matters, don't rely on it.",
  "<b>Privacy and security.</b> Is this data allowed in this tool? Use approved tools, share only what's needed, and keep sensitivity labels on.",
  "<b>Inclusiveness.</b> Does it work for everyone who has to use it, including people on screen readers or working in a second language?",
  "<b>Transparency.</b> Do people know AI was involved, and what it can't do? Don't pass off AI output as a checked fact.",
  "<b>Accountability.</b> A person owns every AI output and every AI project. “The AI did it” is never the answer."],
 compare:{weak:{tag:"Needs a project and review",text:"Used AI to rank 40 job applicants and sent the top five to the hiring manager.",note:"Decisions about people's jobs are what Microsoft calls a sensitive use. That needs a project, a Tier 3 review and a person making every call."},
          strong:{tag:"Fine as personal use",text:"Used AI to turn my own interview notes into a scorecard against our criteria. I made the ratings and the decision myself.",note:"It organises your evidence. The judgement is yours, and it's recorded as yours."}},
 tryit:"Think of one way you use AI now. Run it past the six questions above. If any answer makes you uneasy, talk to your manager or start a project so it gets reviewed.",
 quiz:{q:"Which of these needs a project and a review, not just a prompt?",
  opts:["Summarising your own meeting notes","Using AI to shortlist job candidates","Rewriting an internal announcement"],
  right:1,fb:["That's everyday personal use. Just check the output.","Right. It affects people's job opportunities, which is a sensitive use under Microsoft's standard.","That's everyday personal use. Just check facts and dates."]}},

{id:"copilot",title:"Copilot sees what you can see",mins:5,
 why:"Microsoft 365 Copilot works inside our tenant and draws on the files, emails, chats and meetings you already have access to. That's what makes it useful. It's also why careless sharing matters more than it used to.",
 points:[
  "<b>It respects your permissions.</b> Copilot only uses content you can already open. It never gives you access to anything new.",
  "<b>But it finds things fast.</b> If a folder was shared with the whole company by mistake, Copilot can surface it in someone's answer. Oversharing that nobody noticed for years becomes visible in seconds.",
  "<b>Sensitivity labels matter.</b> Put the right label on confidential files. Copilot respects labels, and content it creates from a labelled file picks up that label.",
  "<b>Check the references.</b> Copilot shows which files and messages it used. Open them. If it cited something you didn't expect to see, tell the owner.",
  "<b>Share on purpose.</b> Share with named people or groups, not everyone in the organisation, unless everyone really needs it."],
 compare:{weak:{tag:"Risky",text:"Shared the salary review spreadsheet with “People in your organization” so two managers could open it.",note:"Now it can turn up in anyone's Copilot answer about pay."},
          strong:{tag:"Safe",text:"Shared it with the two managers by name and applied the Confidential sensitivity label.",note:"They can open it. It won't appear for anyone else."}},
 tryit:"Open the sharing settings on the three folders or sites you use most. Check who they're shared with, and tighten anything shared more widely than it needs to be.",
 quiz:{q:"Copilot shows you a document about a reorganisation you weren't meant to see. What most likely happened?",
  opts:["Copilot got around our security","The document was shared more widely than intended, and Copilot found it","Copilot made the document up"],
  right:1,fb:["Copilot only uses content you already have permission to open.","Right. Tell the file owner or IT so they can fix the sharing.","It can get details wrong, but a real document in its references means it exists and you can open it."]}}
];

/* Team session plan */

 c:"The contradictions it flags are the most useful part. Treat \"likely to raise\" as a prompt for your own thinking, not as intelligence about the customer."},
{id:"followup",app:["Teams", "Outlook"],t:"Turn a call transcript into a follow-up email and commitments",r:["Sales","Product & Design","Customer Success","Engineering"],s:["Meetings","Email","Writing"],lvl:"start",save:"30 min per call",
 what:"The follow-up email you keep meaning to send. Paste the transcript and get the recap email, plus a separate internal list of what was promised, by whom and by when.",
 p:"Below is a transcript of a call with [customer]. Produce two things:\n\n1. A follow-up email to the customer confirming what was agreed and the next steps, with owners and dates. No filler opening.\n2. A separate internal list of every commitment made on our side, who made it and the date attached. Include vague ones and mark them VAGUE.\n\nOnly include commitments actually said in the transcript.\n\n[paste transcript]",
 c:"Check the commitments against your memory of the call before sending anything. The vague ones are where you'll find promises you didn't realise you'd made."},
{id:"qbr",app:["PowerPoint", "Word"],t:"Draft the business review story from the numbers",r:["Sales","Finance"],s:["Reports & decks","Writing"],lvl:"build",save:"4–6 hrs per review",
 what:"You have the numbers. You need the story and slide titles that actually say something. Give it the data and last quarter's version, and forbid it from inventing figures.",
 p:"Here is this quarter's performance data for [account] and last quarter's review narrative for tone.\n\nDraft this quarter's narrative: what happened, why it matters to them, what we propose next. Also give me a title for each slide that states the point, not the topic.\n\nUse only the figures I've given. Don't calculate, estimate or round. Wherever a claim needs a number I haven't provided, write [NEED FIGURE].\n\n[paste data]\n\n[paste last quarter's narrative]",
 c:"Check every number in the draft against your source. Invented figures do the most damage in this use."},
{id:"careemail",app:["Outlook"],t:"Reply to a difficult customer email",r:["Customer Success","Sales"],s:["Email","Writing"],lvl:"start",save:"10–20 min each",
 what:"The customer is angry and partly right. Paste their email and the facts you've confirmed, and get a reply that acknowledges the problem, states what you'll do, and avoids promising what you can't deliver.",
 p:"Draft a reply to the customer email below. Confirmed facts:\n- [what actually happened]\n- [what we can offer: credit, redelivery, callback]\n- [what we cannot offer]\n\nAcknowledge the specific problem in their words. State exactly what we'll do and when. Don't over-apologise, don't blame anyone, and don't offer anything not listed above. Under 130 words.\n\n[paste customer email]",
 c:"Check that the offer matches what you're authorised to give. Models tend to add goodwill gestures nobody approved."},
{id:"kb",app:["Copilot Chat"],t:"Turn a solved case into a knowledge article",r:["Customer Success","IT & Security"],s:["Tickets & queues","Writing"],lvl:"start",save:"20 min per article",
 what:"The knowledge base is thin because nobody enjoys writing articles. Resolved case in, draft article out, in your template.",
 p:"Below is a resolved case or ticket thread. Write a knowledge article with these sections: the symptom as the customer or user would describe it, who it affects, resolution steps in order, and how to confirm it's fixed.\n\nWrite for someone who doesn't know the system. Remove names, case numbers and customer details. Where the thread implies a step without stating it, mark it [VERIFY].\n\n[paste thread]",
 c:"The person who solved it reviews the draft. A confidently wrong article costs more than no article."},
{id:"triage",app:["Copilot Chat"],t:"Find the root causes in a ticket backlog",r:["IT & Security","Customer Success"],s:["Tickets & queues","Data cleanup"],lvl:"build",save:"4–8 hrs/week",
 what:"Categorise tickets, group duplicates, and spot the ones that share an underlying problem. The grouping is where the value is, because it finds the single fix that closes thirty tickets.",
 p:"Below are [N] ticket titles and descriptions. Do three things:\n1. Assign each to one of these categories: [your list]. Use \"Unclear\" rather than guessing.\n2. Group tickets that look like the same underlying issue, and name the issue.\n3. List the three root causes that would close the most tickets if fixed, with the ticket IDs for each.\n\n[paste tickets]",
 c:"Before routing tickets on its categories, sample fifty and measure how often it's right. Never auto-close anything on its say-so."},
{id:"postmortem",app:["Copilot Chat"],t:"Draft the factual half of an incident review",r:["IT & Security","Operations"],s:["Writing","Contracts & documents"],lvl:"start",save:"2–3 hrs per incident",
 what:"The timeline and impact sections are assembled from material you already have in the channel and the ticket. Let it do the assembly. You write the analysis, because that's where the judgement is.",
 p:"Below is the incident channel log and ticket history. Draft the factual sections of an incident review: timeline with timestamps, how it was detected, impact and duration, and actions taken in order.\n\nDo not write root cause, contributing factors or follow-up actions. Leave those as empty headings. Mark anything you inferred rather than read directly as [INFERRED].\n\n[paste log]",
 c:"Check timestamps and impact figures against monitoring. The analysis stays with people, because that's where the learning happens."},
{id:"jd",app:["Word"],t:"Rewrite a job description so people apply",r:["People"],s:["Writing"],lvl:"start",save:"1 hr per role",
 what:"Most job descriptions are lists of responsibilities copied from the last posting. Ask for a rewrite that leads with the actual work and cuts phrases that appear in every advert.",
 p:"Rewrite this job description. Open with what the person will actually work on in their first six months. Cut every phrase that could appear in any job ad at any company. Keep the required qualifications exactly as written, without adding, removing or softening any. Aim for 40% shorter.\n\n[paste job description]",
 c:"Compare the qualifications with the original line by line. A quietly changed requirement is a compliance problem, not a style issue."},
{id:"interview",app:["Copilot Chat"],t:"Turn interview notes into a structured scorecard",r:["People","Everyone"],s:["Meetings","Writing"],lvl:"start",save:"20 min per interview",
 what:"Scribbled notes become a consistent scorecard against your actual criteria, which makes debriefs shorter and comparisons fairer.",
 p:"Here are my rough notes from an interview. Organise them against these criteria: [list your competencies].\n\nFor each criterion, give the evidence from my notes and mark it Strong, Mixed or Not observed. Where I recorded no evidence, the answer is Not observed; don't infer a rating. Finish with two questions I should have asked and didn't.\n\n[paste notes]",
 c:"Never let it recommend whether to hire. It organises your evidence; the judgement stays yours and is recorded as yours."},
{id:"benefitsq",app:["Copilot Chat"],t:"Answer the same policy question asked forty different ways",r:["People","Finance"],s:["Policy questions","Email"],lvl:"build",save:"3–5 hrs/week",
 what:"People ask the same twenty questions in endless variations. Answer from the actual policy, with the source quoted, so employees get a quick answer and you keep a record of where it came from.",
 p:"Answer this employee question using only the policy text below.\n\nQuestion: [paste it]\n\nAnswer in under 100 words, in plain language, and quote the sentence you're relying on. If the policy doesn't clearly answer it, say so and direct them to [team]. Don't fill gaps with what other companies typically do.\n\n[paste policy]",
 c:"Wrong answers about pay, leave or benefits have real consequences for people. A person reviews anything about eligibility or money before it's sent."},
{id:"announce",app:["Outlook", "Word"],t:"Rewrite an announcement so people actually read it",r:["Marketing","People","Everyone"],s:["Writing","Email"],lvl:"start",save:"30–60 min each",
 what:"Corporate announcements tend to bury the point in paragraph four. Ask for the change first, then the action needed, then the background, with the filler phrases listed so you can defend the edit.",
 p:"Rewrite this internal announcement. Open with what's changing and what the reader has to do, then the date, then any background. Cut corporate filler and list the phrases you cut. Keep every fact, date, name and system reference exactly as written. Aim for 40% shorter.\n\n[paste announcement]",
 c:"Check dates, names and system names against the original. Details get lost quietly when text is shortened."},
{id:"audiences",app:["PowerPoint", "Word"],t:"One update, three audiences",r:["Marketing","Product & Design","Engineering"],s:["Reports & decks","Writing"],lvl:"build",save:"2–4 hrs per deck",
 what:"The same content has to work for an executive, a technical team and customers. Paste your notes and ask for each version, with what to cut and what to lead with.",
 p:"Here are my notes for an update on [project]. Produce three versions:\n1. Executive: five points maximum, decisions and money only\n2. Technical team: how it works and what changes for them\n3. Customer-facing: what changes for them and when, with no internal detail\n\nFor each, say what you cut from my notes and what the opening line should be.\n\n[paste notes]",
 c:"Check the customer-facing version most carefully for internal detail that shouldn't go outside."},
{id:"status",app:["Word", "Copilot Chat"],t:"Write the weekly status report you keep rewriting",r:["Product & Design","IT & Security","Engineering"],s:["Reports & decks","Writing"],lvl:"start",save:"1–2 hrs/week",
 what:"Same format, new facts, every week. Give it last week's report and this week's raw updates, and ask it to spell out what changed, which is the part readers want.",

 c:"The \"disappeared without being closed\" list is the most useful output. Confirm it with the team before publishing."},
{id:"premortem",app:["Copilot Chat"],t:"Find the holes in a plan before you present it",r:["Product & Design","Everyone","Engineering"],s:["Planning","Research"],lvl:"start",save:"1 hr, high payoff",
 what:"A pre-mortem you can run alone at your desk. Describe the plan, ask why it failed, and ask what a particular sceptic will object to. It won't always be right, but it usually finds a couple of things you'd stopped seeing.",
 p:"Below is a plan I'm presenting to [audience]. Do three passes:\n1. It's six months later and this has failed. Give the five most likely reasons, ranked by likelihood, not drama.\n2. What am I assuming that I haven't said?\n3. What will [a named sceptical stakeholder, and what they care about] object to first?\n\nBe specific to this plan and skip generic project risks.\n\n[paste plan]",
 c:"Treat the output as things to think about, not findings. Its job is to break your tunnel vision, not to be right."},
{id:"exceltable",app:["Excel", "Copilot Chat"],t:"Clean up a column of free text",r:["Everyone","Finance","People"],s:["Data cleanup","Spreadsheets"],lvl:"build",save:"2–4 hrs per dataset",
 what:"Free-text fields where people typed job titles, locations or reasons however they liked. Ask for a mapping table you keep and can audit, rather than cleaned data you can't trace.",
 p:"Below is a column of free-text values typed by people. Propose a standard mapping: for each distinct raw value, the standard value it should map to.\n\nList the standard values first, keeping the set small and sensible. Then output a two-column table I can paste into a lookup: raw value | standard value. Put anything genuinely ambiguous under REVIEW rather than forcing it.\n\n[paste values]",
 c:"Keep the mapping table, not just the cleaned output. When someone asks how a value was categorised, you need to be able to show them."},
{id:"jepacket",app:["Copilot Chat"],t:"Completeness check on a journal entry packet",r:["Finance"],s:["Contracts & documents","Data cleanup"],lvl:"stretch",save:"1–2 hrs per packet",
 what:"Not approval. A completeness check before the packet reaches the reviewer: is the support there, do the amounts appear in it, is anything obviously missing. It cuts down on packets sent back, not on errors.",
 p:"Below is a journal entry and its supporting documents. Act only as a completeness check. You are not approving anything.\n\nCheck:\n- Does every amount in the entry appear somewhere in the support?\n- Is any referenced document missing?\n- Is the stated business reason consistent with the support?\n- Are approvals present where the entry says they are?\n\nList only what's missing or inconsistent. Don't recalculate anything and don't comment on whether the accounting is correct.\n\n[paste entry and support]",
 c:"This never replaces reviewer approval and never touches SOX sign-off. The only claim is that fewer packets get sent back."},
{id:"forecastq",app:["Copilot Chat"],t:"Question a forecast before you sign up to it",r:["Operations","Finance","Sales"],s:["Planning","Spreadsheets","Research"],lvl:"stretch",save:"varies, high payoff",
 what:"Paste the assumptions behind a volume or cost forecast and ask what would have to be true for it to hold. It won't know our market better than you, but it will list the assumptions you haven't examined.",
 p:"Below are the assumptions behind a [volume / cost / revenue] forecast for [period].\n\nDon't produce a new forecast. Instead:\n1. List every assumption, including implied ones, and rate how sensitive the result is to each (high, medium, low)\n2. For the high-sensitivity ones, say what evidence would confirm or break them\n3. Name one plausible scenario the forecast ignores\n\n[paste assumptions and headline figures]",
 c:"It will be confident about industry patterns it can't check. Use the list to direct your own checks. Don't quote it."},
{id:"askbetter",app:["Copilot Chat"],t:"Find the question you should have asked",r:["Everyone"],s:["Research","Planning","Meetings"],lvl:"stretch",save:"varies, high payoff",
 what:"An underused approach. Describe a situation and ask what you're not considering, given your role and constraints. It works well before a decision and badly after one, when you're mostly looking for agreement.",
 p:"Here's a situation I'm working through: [describe it, including constraints and what I've already ruled out].\n\nDon't recommend what to do. Tell me: what am I not considering, what would someone in [another function] see that I'm missing, and what question would I regret not asking before I decide? Be specific to this situation.",
 c:"Ask before you decide. Afterwards you'll keep the answers that agree with you and dismiss the rest."},
{id:"shorten",app:["Outlook", "Word"],t:"Make writing shorter without making it cold",r:["Everyone","Marketing"],s:["Writing","Email"],lvl:"start",save:"15 min each",
 what:"Most people over-write when the stakes feel high. Ask for a cut that keeps the tone and locks the facts, and ask what it removed so you can put back anything that mattered.",
 p:"Cut this by about a third without changing the tone or losing any fact, date, name or commitment. Keep it warm, not clipped. Then list what you removed so I can put back anything that mattered.\n\n[paste text]",
 c:"Read the removal list. The sentence you actually needed will be there."},
{id:"rfpq",app:["Copilot Chat"],t:"Draft the question list for an RFP",r:["Operations","IT & Security"],s:["Contracts & documents","Planning"],lvl:"start",save:"2–3 hrs per RFP",
 what:"A solid first draft of the questions is mostly routine work. Describe what you're buying and ask specifically for the questions vendors dislike, because those are the ones that separate them.",
 p:"We're buying [category] for [context: scale, users, systems it must connect to, constraints].\n\nDraft an RFP question list grouped under: functional fit, integration, security and data handling, commercial terms, support. Then add a short section of questions vendors usually dodge, where a vague answer is itself a finding.",
 c:"Our Legal, Security and Procurement standards override anything it suggests. Use it to make sure you've covered everything, not for compliance wording."},
{id:"dataextract",app:["Copilot Chat"],t:"Pull a table out of a PDF or scan",r:["Finance","Operations","Everyone"],s:["Data cleanup","Contracts & documents","Spreadsheets"],lvl:"build",save:"30–90 min each",
 what:"A rate card, a price list or a remittance in a PDF, and you need it in Excel. Ask for a paste-ready table with the rows it couldn't read clearly listed separately.",
 p:"Extract the table from the document below into tab-separated text I can paste into Excel. Columns: [list the columns you want].\n\nKeep numbers exactly as printed, with no rounding and no currency conversion. If a cell is unreadable or ambiguous, write ?? in it and list those rows at the end with the reason.\n\n[paste or attach the document]",
 c:"Check the row count and spot-check the totals against the PDF. Dropped or merged rows are the usual error, and they're silent."},
{id:"cp-recap",app:["Teams"],t:"Catch up on a Teams meeting you missed",r:["Everyone"],s:[],lvl:"start",save:"20–40 min per meeting",first:1,
 what:"If the meeting was recorded or transcribed, Copilot in Teams can tell you what happened. Ask for what matters to you, not a general summary.",
 p:"I missed this meeting. Tell me:\n1. Decisions that were made\n2. Anything assigned to me or my team, with who asked\n3. Open questions that are still unresolved\n4. Anything that was said about [my project or area]\n\nFor each point, say roughly when in the meeting it came up so I can check the recording.",
 c:"Jump to the moments it points to and listen for yourself before acting on anything assigned to you. Recaps can miss tone and context."},
{id:"cp-thread",app:["Outlook"],t:"Summarise a long email thread and draft your reply",r:["Everyone"],s:[],lvl:"start",save:"15–30 min per thread",
 what:"Use Copilot in Outlook on the thread you've been avoiding. Get the state of play first, then a draft reply you edit.",
 p:"Summarise this thread in five bullets: what's been decided, what's still open, and what people are waiting on me for.\n\nThen draft a reply that [answers the open question about X / confirms Y / pushes back on Z]. Keep it under 120 words, direct and friendly. Don't commit to any date or deliverable I haven't mentioned.",
 c:"Check the draft for promises. Outlook drafts sometimes agree to things just to be helpful."},
{id:"cp-word",app:["Word"],t:"Draft a document from your own files in Word",r:["Everyone","Product & Design"],s:[],lvl:"build",save:"1–3 hrs per document",
 what:"Copilot in Word can draft from files you reference, so you start from your own material rather than generic text. Type / in the Copilot prompt to pick the files.",
 p:"Draft a [one-page proposal / project update / customer summary] for [audience] using [reference the source files].\n\nStructure: [the headings you want]. Use only facts from the referenced files. Where you'd need information that isn't in them, write [NEED INPUT] instead of filling the gap. Keep it under [length].",
 c:"Check every figure and claim against the files it used. [NEED INPUT] markers are where your judgement is needed."},
{id:"cp-excel",app:["Excel"],t:"Find what's going on in a spreadsheet with Copilot in Excel",r:["Finance","Sales","Operations","Data & Analytics"],s:[],lvl:"build",save:"30–90 min per analysis",
 what:"Copilot in Excel works best when your data is formatted as a table with clear column headers. Ask it for patterns and for formulas you can check, not for final numbers to paste into a report.",
 p:"Look at this table and tell me:\n1. The three biggest changes in [measure] between [period A] and [period B]\n2. Which [segment / region / product] is driving each one\n3. A formula column or PivotTable I could add to check this myself\n\nFlag anything that looks like a data problem (blanks, duplicates, odd outliers) before drawing conclusions.",
 c:"Re-check every number with a formula or PivotTable before it goes in a report. Use Copilot to point you at where to look."},
{id:"cp-ppt",app:["PowerPoint"],t:"Turn a Word document into a first-draft deck",r:["Everyone","Product & Design","Sales"],s:[],lvl:"start",save:"1–2 hrs per deck",
 what:"Copilot in PowerPoint can build a draft presentation from a Word document you reference. Tell it who the audience is and how many slides, then fix it up.",
 p:"Create a [8]-slide presentation from [reference the Word document] for [audience].\n\nOpen with the decision or key message, not background. One idea per slide, slide titles that state the point, and no more than four bullets per slide. Put the detail in speaker notes.",
 c:"Check that numbers and names came across correctly, and replace any generic images. Your template and brand rules still apply."},
{id:"cp-prep",app:["Copilot Chat"],t:"Prepare for a meeting using your email, chats and files",r:["Everyone","Sales","Customer Success"],s:[],lvl:"start",save:"20–45 min per meeting",
 what:"Microsoft 365 Copilot Chat can pull together what you already have on a topic across Outlook, Teams and your files. It only uses content you can already open.",
 p:"I'm meeting [person / customer / team] about [topic] on [day]. From my recent emails, Teams chats and files, pull together:\n- Where things stand, in three bullets\n- Anything I promised and haven't done\n- Open questions or disagreements\n- Three questions I should ask\n\nList the sources you used for each point.",
 c:"Open the sources it lists. If it pulled in something you didn't expect to have access to, tell the owner. That's an oversharing problem worth fixing."}
];
</script>
<script>
"use strict";
/* ============================================================
   Helpers
   ============================================================ */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>(p||"")+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o||{}));
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};
function num(v){if(typeof v==="number")return isFinite(v)?v:0;if(!v)return 0;
  const m=String(v).trim().toLowerCase().replace(/[$,\s]/g,"").match(/^(-?\d*\.?\d+)(k|m)?$/);if(!m)return 0;
  let n=parseFloat(m[1]);if(m[2]==="k")n*=1e3;if(m[2]==="m")n*=1e6;return isFinite(n)?n:0;}
const money=n=>(n<0?"-$":"$")+Math.abs(Math.round(n)).toLocaleString("en-US");
function short$(n){const a=Math.abs(n),s=n<0?"-":"";
  if(a>=1e6)return s+"$"+(a/1e6).toFixed(a>=1e7?1:2).replace(/\.?0+$/,"")+"M";
  if(a>=1e3)return s+"$"+Math.round(a/1e3)+"k";return s+"$"+Math.round(a);}
const fmtN=n=>Math.round(n).toLocaleString("en-US");
const fmtDate=iso=>iso?new Date(iso).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}):"";
let tT;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tT);tT=setTimeout(()=>t.classList.remove("on"),2800);}
function copyText(text,done){
  const fb=()=>{const a=document.createElement("textarea");a.value=text;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();
    let ok=false;try{ok=document.execCommand("copy");}catch(e){}a.remove();ok?done():toast("Couldn't copy. Select the text and press Ctrl+C.");};
  try{navigator.clipboard.writeText(text).then(done,fb);}catch(e){fb();}
}
async function saveFile(name,data){
  let dl=null;try{if(window.claude&&window.claude.use)dl=await window.claude.use("downloads");}catch(e){}
  if(dl){try{await dl.save({filename:name,data});toast("Saved "+name);}
    catch(e){toast(e&&e.code==="declined"?"Save cancelled":"Saving files isn't available here");}return;}
  const blob=data instanceof Blob?data:new Blob([data],{type:"text/plain"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);toast("Saved "+name);
}
const slug=s=>(s||"file").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,50)||"file";
const hl=s=>esc(s).replace(/\[([^\]]+)\]/g,"<mark>[$1]</mark>");
const csvRow=r=>r.map(v=>{const s=String(v==null?"":v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(",");
function isoWeek(d){d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);
  const y=new Date(Date.UTC(d.getUTCFullYear(),0,1));return [d.getUTCFullYear(),Math.ceil(((d-y)/864e5+1)/7)];}
function loadJsPDF(){
  if(window.jspdf&&window.jspdf.jsPDF)return Promise.resolve(window.jspdf.jsPDF);
  return new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    s.onload=()=>window.jspdf?res(window.jspdf.jsPDF):rej();s.onerror=rej;document.head.appendChild(s);});
}

/* ============================================================
   Data layer. Shared (claude.ai db) when available, otherwise
   this browser only. Every view reads from D and writes via put/del.
   ============================================================ */
const COLLS=["people","wins","projects","approvals","prompts"];
const D={mode:"loading",db:null,user:null,me:"me",admin:true,canWrite:true,config:clone(DEFAULT_CONFIG)};
COLLS.forEach(c=>D[c]=[]);
const LKEY="cp3-data";
function localLoad(){const o=store.get(LKEY,{});COLLS.forEach(c=>{D[c]=Object.entries(o[c]||{}).map(([id,v])=>Object.assign({id},v));});
  D.config=Object.assign(clone(DEFAULT_CONFIG),o.config||{});}
function localSave(){const o={config:D.config};COLLS.forEach(c=>{o[c]={};D[c].forEach(r=>{const x=Object.assign({},r);delete x.id;o[c][r.id]=x;});});store.set(LKEY,o);}
function writeError(e){
  const c=e&&e.code;
  if(c==="invalid_argument"){toast("You don't have permission to change that. Ask a portal admin for Contributor access.");}
  else if(c==="quota_exceeded")toast("The portal's storage is full. An admin needs to remove old entries.");
  else toast("Couldn't save just now. Try again in a moment.");
  throw e;
}
async function put(coll,id,obj){
  obj=clone(obj);delete obj.id;
  if(D.mode==="shared"){try{await D.db.doc(coll+"/"+id).set(obj);}catch(e){writeError(e);}return;}
  if(coll==="config"){D.config=Object.assign(clone(DEFAULT_CONFIG),obj);}
  else{const i=D[coll].findIndex(r=>r.id===id),row=Object.assign({id},obj);if(i>=0)D[coll][i]=row;else D[coll].push(row);}
  localSave();onData();
}
async function del(coll,id){
  if(D.mode==="shared"){try{await D.db.doc(coll+"/"+id).delete();}catch(e){writeError(e);}return;}
  D[coll]=D[coll].filter(r=>r.id!==id);localSave();onData();
}
async function connect(){
  let db=null,user=null;
  try{if(window.claude&&window.claude.use)[db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);}catch(e){}
  if(!db){D.mode="local";localLoad();onData(true);return;}
  D.mode="shared";D.db=db;D.user=user;
  if(user){D.me=(await user.id())||null;D.admin=await user.canEdit();const cw=await user.can("data.write");D.canWrite=cw!==false;}
  else{D.me=null;D.admin=false;}
  COLLS.forEach(c=>db.collection(c).onSnapshot(s=>{D[c]=s.docs.map(d=>Object.assign({id:d.id},clone(d.data())));onData();},e=>console.warn("db",c,e&&e.code)));
  db.doc("config/settings").onSnapshot(s=>{D.config=Object.assign(clone(DEFAULT_CONFIG),s.exists?clone(s.data()):{});onData();},()=>{});
  onData(true);
}

/* ============================================================
   Derived numbers used across the portal
   ============================================================ */
const cfg=()=>D.config;
const winHours=w=>num(w.mins)/60*(FREQ[w.freq]?FREQ[w.freq][1]:1);
const countFactor=()=>Math.max(0,Math.min(100,num(cfg().countPct)))/100;
const myPerson=()=>D.people.find(p=>p.id===D.me)||{id:D.me,team:"",done:[]};
function levelOf(id){
  const p=D.people.find(x=>x.id===id)||{},wins=D.wins.filter(w=>w.by===id).length,shared=D.prompts.some(x=>x.by===id);
  const checks=[[1,"Pick your team",!!p.team],[2,`Finish all ${LESSONS.length} lessons`,(p.done||[]).length>=LESSONS.length],
    [3,"Log 3 wins",wins>=3],[4,"Share a prompt with colleagues",shared],[4,"Run a team session, or log 10 wins",!!p.ranSession||wins>=10]];
  let lvl=0;for(let n=1;n<=4;n++){if(checks.filter(c=>c[0]===n).every(c=>c[2]))lvl=n;else break;}
  return {lvl,checks,wins};
}
function stats(){
  const c=cfg(),now=Date.now(),d30=now-30*864e5;
  const real=D.people.filter(p=>p.team);
  const trained=real.filter(p=>(p.done||[]).length>=LESSONS.length).length;
  const active=new Set([...D.wins.filter(w=>new Date(w.created).getTime()>d30).map(w=>w.by),...D.people.filter(p=>p.updated&&new Date(p.updated).getTime()>d30).map(p=>p.id)]).size;
  const reported=D.wins.reduce((a,w)=>a+winHours(w),0),counted=reported*countFactor();
  const live=D.projects.filter(p=>p.stage==="Live").length;
  const approvedStages=["Approved","Pilot","Live"];
  const planned=D.projects.filter(p=>approvedStages.includes(p.stage)).reduce((a,p)=>a+calc(p.brief||{}).counted,0);
  const realized=D.projects.reduce((a,p)=>a+(p.benefits||[]).reduce((s,r)=>s+num(r.actual),0),0);
  const champions=real.filter(p=>levelOf(p.id).lvl>=4).length;
  return {headcount:num(c.headcount)||1,signedIn:real.length,trained,active,reported,counted,value:counted*num(c.rate),live,planned,realized,champions,
    hasExamples:COLLS.some(k=>D[k].some(r=>r.example))};
}

    <p class="small muted">Showing ${list.length}. ${PF.tab==="library"?"The ones marked “good first try” are easy to check, so start there.":"Shared by people here. Check them the same way you'd check any prompt."}</p>
  </div>
  <div class="plist">${list.length?list.map(p=>`<div class="pitem${PF.open===p.id?" open":""}" id="p-${esc(p.id)}">

      <span class="who">${(p.app||[]).length?`<b style="color:var(--black)">${esc(p.app.join(" · "))}</b> · `:""}${esc((p.r||[]).join(" · "))}${p.lvl==="start"?" · <b style='color:var(--red)'>good first try</b>":""}${p.shared?` · shared by ${who(p.by)}`:""}</span></button>

      ${p.shared&&(p.by===D.me||D.admin)?`<div><button class="btn sm plain" type="button" data-delp="${esc(p.id)}">Remove this prompt</button></div>`:""}</div></div>`).join("")
    :`<div class="empty">${PF.tab==="shared"&&!shared.length?"Nobody has shared a prompt yet. Be the first. It counts towards Champion.":"Nothing matches. Try a shorter search, or pick “All functions”."}</div>`}</div>`;
  const v=$("v-prompts");
  v.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{PF.tab=b.dataset.tab;PF.open=null;renderPrompts();fillNames(v);});

  v.querySelectorAll("[data-app]").forEach(b=>b.onclick=()=>{PF.app=b.dataset.app;renderPrompts();fillNames(v);});
  $("pSearch").oninput=e=>{PF.text=e.target.value.trim();const pos=e.target.selectionStart;renderPrompts();fillNames(v);const s=$("pSearch");s.focus();s.setSelectionRange(pos,pos);};
  const so=$("shareOpen");if(so)so.onclick=()=>{PF.sharing=!PF.sharing;renderShare();};
  renderShare();
  v.querySelector(".plist").onclick=async e=>{
    const c=e.target.closest("[data-copy]");
    if(c){const id=c.dataset.copy,p=PROMPTS.find(x=>x.id===id)||D.prompts.map(x=>({p:x.prompt,id:x.id})).find(x=>x.id===id);
      copyText(p.p,()=>{c.textContent="Copied";setTimeout(()=>c.textContent="Copy prompt",1500);toast("Copied. Replace the red parts with your details.");});return;}
    const d=e.target.closest("[data-delp]");if(d){await del("prompts",d.dataset.delp).catch(()=>{});toast("Prompt removed");return;}

function renderShare(){

    <div class="row"><button class="btn red" type="submit">Share it</button><button class="btn plain" type="button" id="s_cancel">Cancel</button></div></form>`;
  $("s_cancel").onclick=()=>{PF.sharing=false;renderShare();};
