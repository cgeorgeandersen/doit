<script>
"use strict";
/* ============================================================
   PROJECTS: model
   ============================================================ */
const BRIEF_BLANK=()=>({decision:"Approve a pilot",decideBy:"",ask:"",problem:"",plan:"",ifnot:"",once:0,running:0,benefit:0,basis:"",conf:"Medium",
  timeSaved:false,timeGoes:"",startMonth:3,milestones:[["",""],["",""]],risks:[["",""]],success:""});
const PROJECT_BLANK=()=>({title:"",team:"",sponsor:"",by:D.me,created:new Date().toISOString(),stage:"Idea",
  intake:{people:"",hours:"",a:{}},risk:{},brief:BRIEF_BLANK(),
  pilot:{passMark:"",start:"",end:"",result:"",actual:""},controls:{fairness:"",reliability:"",privacy:"",inclusiveness:"",transparency:"",accountability:"",lastReview:""},
  signoff:{privacy:"",privacyDate:"",legal:"",legalDate:"",security:"",securityDate:""},
  benefits:[],review:{worked:"",didnt:"",lessons:"",rec:"",date:""},history:[]});
function deepFill(t,d){for(const k in d){if(t[k]==null)t[k]=clone(d[k]);else if(d[k]&&typeof d[k]==="object"&&!Array.isArray(d[k])&&typeof t[k]==="object")deepFill(t[k],d[k]);}return t;}
function normProject(p){
  const c=p.controls||{};/* older projects stored oversight/monitoring; carry them into the matching principles */
  if(c.oversight&&!c.accountability)c.accountability=c.oversight;
  if((c.monitoring||c.switchoff)&&!c.reliability)c.reliability=[c.monitoring,c.switchoff].filter(Boolean).join(" ");
  p.controls=c;return deepFill(p,PROJECT_BLANK());
}
const raiDone=p=>RAI.every(r=>(p.controls[r.id]||"").trim().length>10);
function liveSince(p){const h=(p.history||[]).filter(x=>/ to Live$/.test(x.what));return h.length?h[h.length-1].at:null;}
function reviewDue(p){
  if(p.stage!=="Live")return null;
  const base=p.controls.lastReview||liveSince(p)||p.created;if(!base)return null;
  const d=new Date(base);d.setMonth(d.getMonth()+TIERS[tierOf(p).tier].reviewMonths);
  return {due:d,overdue:d<new Date()};
}

function calc(b){
  b=b||{};const factor=(CONF_LEVELS[b.conf]||CONF_LEVELS.Medium)[0],counted=num(b.benefit)*factor,running=num(b.running),once=num(b.once);
  const start=Math.min(36,Math.max(1,Math.round(num(b.startMonth))||1)),live=37-start,monthly=(counted-running)/12,net3=monthly*live-once;
  let payback=null;if(monthly>0){const m=start-1+Math.ceil(once/monthly);payback=m<=36?m:null;}
  return {factor,counted,running,once,start,net3,payback};
}
const sentences=t=>(t||"").split(/(?<=[.!?])\s+/).filter(s=>s.trim());
const words=t=>((t||"").match(/\b[\w'’-]+\b/g)||[]).length;
const hasNum=t=>/\d/.test(t||"");
const briefObj=p=>Object.assign({},p.brief,{title:p.title,author:p.team,sponsor:p.sponsor});
function review(b){
  const all=[b.ask,b.problem,b.plan,b.ifnot,b.basis,b.success,...(b.risks||[]).flat(),...(b.milestones||[]).map(m=>m[0])].join(" ");
  const wc=words(all),longS=[b.ask,b.problem,b.plan,b.ifnot].flatMap(sentences).filter(s=>words(s)>30);
  const low=" "+all.toLowerCase().replace(/[^a-z\s-]/g," ")+" ",jargon=[...new Set(JARGON.filter(j=>low.includes(" "+j+" ")))];
  return [
    [!!(b.ask||"").trim(),"The ask is written","Write the ask as one sentence: what you want approved, and for how much."],
    [sentences(b.ask).length<=1&&hasNum(b.ask),"The ask is one sentence with a number","Execs decide faster on “approve $85k for a 12-week pilot” than on a paragraph."],
    [hasNum(b.problem),"The problem has a number in it","Say how big the problem is: hours, dollars, days, tickets. Without a number it's an opinion."],
    [!!(b.ifnot||"").trim(),"You've said what happens if we don't","Execs always ask “what if we do nothing?” Answer it first."],
    [num(b.benefit)===0?false:(b.basis||"").trim().length>10,"The benefit has a number and a source","Add the yearly benefit and where it comes from: a trial, a measurement, a quote."],
    [!b.timeSaved||(b.timeGoes||"").trim().length>5,"Freed-up time has somewhere to go","You've counted time saved. Say what that time will be used for, or treat it as zero."],
    [(b.risks||[]).some(r=>r[0].trim()),"At least one risk is named","A brief with no risks reads like a sales pitch."],
    [!!(b.success||"").trim(),"You've said how you'll know it worked","Give one or two measures you'll report back on."],
    [!!(b.author||"").trim()&&!!(b.sponsor||"").trim(),"Owner and sponsor are named","Set the team and the exec sponsor at the top of the project."],
    [jargon.length===0,"No buzzwords",`Swap these for plain words: ${jargon.join(", ")}.`],
    [longS.length===0,"Sentences are short enough",`${longS.length} sentence${longS.length===1?" is":"s are"} over 30 words. Split ${longS.length===1?"it":"them"}.`],
    [wc<=450,"Fits on one page",`About ${wc} words. Aim for under 450.`]
  ];
}
function ideaResult(ic){
  const a=ic.a||{},g=id=>{const q=IDEA_QS.find(x=>x.id===id),k=a[id];return k==null?null:q.o[k][1];};
  const picked=IDEA_QS.filter(q=>a[q.id]!=null).map(q=>({q,o:q.o[a[q.id]]}));
  const hoursYr=num(ic.people)*num(ic.hours)*46;let v;
  if(picked.some(p=>p.o[3]))v="blocked";else if(g("own")===0)v="own";else if(g("rules")===0||g("words")===0)v="automate";
  else if([g("input"),g("spot"),g("owner")].includes(0)||picked.filter(p=>p.o[1]===1).length>=4)v="notyet";
  else if(g("often")===0||(hoursYr>0&&hoursYr<150))v="small";else v="pilot";
  const issues=picked.filter(p=>p.o[2]).sort((x,y)=>x.o[1]-y.o[1]).map(p=>p.o[2]);
  if(hoursYr>0&&hoursYr<150)issues.push(`About ${Math.round(hoursYr)} hours a year. Building and looking after a tool usually costs more than that.`);
  return {v,issues,hoursYr,answered:picked.length,complete:picked.length===IDEA_QS.length&&hoursYr>0};
}
function tierOf(p){const yes=RISK_QS.filter(q=>p.risk[q.id]===true);
  return {tier:Math.max(1,...yes.map(q=>q.tier)),yes,complete:RISK_QS.every(q=>p.risk[q.id]!=null)};}
function pstatus(p){
  const ap=D.approvals.find(a=>a.id===p.id),t=tierOf(p),ir=ideaResult(p.intake),rv=review(briefObj(p));
  const done={intake:ir.complete,risk:t.complete,brief:[0,2,4,5,6,7,8].every(i=>rv[i][0]),
    approval:!!ap&&(ap.decision==="approved"||ap.decision==="conditions"),
    pilot:!!p.pilot.passMark.trim()&&!!p.pilot.result,controls:raiDone(p),
    signoff:!!(p.signoff.privacy.trim()&&p.signoff.privacyDate&&p.signoff.legal.trim()&&p.signoff.legalDate),
    benefits:p.benefits.some(r=>num(r.actual)>0),review:!!p.review.rec&&!!p.review.worked.trim()};
  const required=ARTIFACTS.filter(a=>a[2]<=t.tier).map(a=>a[0]);
  return {ap,t,ir,rv,done,required};
}
function gate(p,st){
  switch(p.stage){
    case "Idea":return {to:"Assessed",needs:[["Intake and idea check complete",st.done.intake],["Risk questions answered",st.done.risk]]};
    case "Assessed":return {to:"Awaiting approval",needs:[["Exec brief complete (see the brief check)",st.done.brief]]};
    case "Awaiting approval":return {to:null,wait:`Waiting for ${TIERS[st.t.tier].who} to record a decision.`};
    case "Approved":return st.t.tier>=2?{to:"Pilot",needs:[["Pilot pass mark written down before starting",!!p.pilot.passMark.trim()],["Pilot start date set",!!p.pilot.start],["Responsible AI assessment complete",st.done.controls]]}
      :{to:"Live",needs:[["Approval recorded",st.done.approval]]};
    case "Pilot":{const n=[["Pilot result recorded as a pass",p.pilot.result==="pass"],["Responsible AI assessment complete",st.done.controls]];
      if(st.t.tier>=3)n.push(["Privacy and legal sign-off recorded",st.done.signoff]);return {to:"Live",needs:n};}
    case "Live":return {to:"Closed",needs:[["Post-launch review done",st.done.review]]};
    default:return {to:null,wait:"This project is closed."};
  }
}
function nextStep(p,st){const rd=reviewDue(p);if(rd&&rd.overdue)return "Risk review overdue";if(rd&&!st.done.review)return "Post-launch review needed";if(rd)return "Next risk review "+rd.due.toLocaleDateString("en-US",{month:"short",year:"numeric"});const g=gate(p,st);if(!g.to)return g.wait;const miss=g.needs.find(n=>!n[1]);return miss?miss[0].replace(/ complete.*| answered| done| set| recorded.*| described| written down before starting/,"")+(miss?" needed":""):`Ready to move to ${g.to}`;}
const addHist=(p,what)=>{p.history=p.history||[];p.history.push({at:new Date().toISOString(),by:D.me,what});};

/* ============================================================
   PROJECTS: register
   ============================================================ */
const PJ={open:null,filter:"active",creating:false,draft:null,dirty:false,timer:null,saving:Promise.resolve(),confirmDel:false};
function renderProjects(){if(PJ.open&&D.projects.find(p=>p.id===PJ.open))return renderProject();PJ.open=null;renderRegister();}
function renderRegister(){
  const F={active:p=>!["Live","Closed"].includes(p.stage),live:p=>p.stage==="Live",closed:p=>p.stage==="Closed",all:()=>true};
  const rows=D.projects.map(p=>normProject(clone(p))).filter(F[PJ.filter]).sort((a,b)=>STAGES.indexOf(b.stage)-STAGES.indexOf(a.stage)||(a.title||"").localeCompare(b.title||""));
  const count=k=>D.projects.filter(F[k]).length;
  $("v-projects").innerHTML=`
  <div class="head"><p class="eyebrow">Projects</p><h2>Every AI project, from idea to proven value.</h2>
    <p>Each project carries its own paperwork: the idea check, a risk tier, the exec brief, the approval record, pilot results and benefits tracking. The risk tier decides how much of it you need.</p></div>
  <div class="row">${D.canWrite?`<button class="btn red" type="button" id="newProj">Start a project</button>`:""}
    <div class="tabs2">${[["active","In progress"],["live","Live"],["closed","Closed"],["all","All"]].map(([k,l])=>`<button class="chip" type="button" data-f="${k}" aria-pressed="${PJ.filter===k}">${l} (${count(k)})</button>`).join("")}</div></div>
  ${PJ.creating?`<form class="box" id="newForm" autocomplete="off"><h3>Start a project</h3>
    <div class="grid2"><div class="field"><label for="n_t">Project name</label><input id="n_t" required placeholder="e.g. AI first drafts for support replies"></div>
    <div class="field"><label for="n_team">Owning team</label><select id="n_team">${(cfg().teams||DEFAULT_TEAMS).map(t=>`<option${t===myPerson().team?" selected":""}>${esc(t)}</option>`).join("")}</select></div></div>
    <div class="row"><button class="btn red" type="submit">Create it</button><button class="btn plain" type="button" id="n_cancel">Cancel</button></div></form>`:""}
  <div class="scroll"><table class="reg"><thead><tr><th>Project</th><th>Stage</th><th>Risk</th><th class="r">Benefit / yr</th><th class="r">Delivered</th><th>Next step</th></tr></thead><tbody>
    ${rows.length?rows.map(p=>{const st=pstatus(p),c=calc(p.brief),real=p.benefits.reduce((a,r)=>a+num(r.actual),0);
      return `<tr class="click" data-go="projects" data-open="${esc(p.id)}" tabindex="0"><td><span class="pt">${esc(p.title||"Untitled project")}</span>${p.example?' <span class="tag ex">Example</span>':""}<br><span class="small muted">${esc(p.team||"No team")}</span></td>
      <td><span class="tag st">${esc(p.stage)}</span></td><td>${st.t.complete?`<span class="tag t${st.t.tier}">Tier ${st.t.tier}</span>`:'<span class="small muted">Not set</span>'}</td>
      <td class="r">${c.counted?short$(c.counted):"–"}</td><td class="r">${real?short$(real):"–"}</td><td class="small">${nextStep(p,st)==="Risk review overdue"?'<span class="tag warn">Risk review overdue</span>':esc(nextStep(p,st))}</td></tr>`;}).join("")
    :`<tr><td colspan="6"><div class="empty" style="border:0">${PJ.filter==="active"?"No projects in progress. Start one when an idea is bigger than one person's prompt.":"Nothing here yet."}</div></td></tr>`}
  </tbody></table></div>
  <div class="box grey"><h3>How this lines up with Microsoft's framework</h3>
    <p class="small muted">Our process follows the four Govern AI steps in Microsoft's Cloud Adoption Framework, and uses Microsoft's six Responsible AI principles to assess each project.</p>
    <div class="cheat">${CAF_STEPS.map(([s,what,here],i)=>`<div class="box"><p class="eyebrow">${i+1} · ${esc(s)}</p><p class="small">${esc(what)}</p><p class="small"><b>In this portal:</b> ${esc(here)}</p></div>`).join("")}</div>
    <div class="chips">${RAI.map(r=>`<span class="chip" title="${esc(r.def)}">${esc(r.name)}</span>`).join("")}<button class="btn sm plain" type="button" data-go="learn" data-lesson="principles">What the principles mean →</button></div></div>
  <details class="more"><summary>Risk tiers, and what each one needs</summary><div>
    <p>Every project moves through the same stages: ${STAGES.map(esc).join(" → ")}. A project can't move to the next stage until its paperwork is done. Only the AI review board can record an approval, and never on a project they started.</p>
    <div class="cheat">${[1,2,3].map(n=>`<div class="box"><span class="tag t${n}" style="align-self:flex-start">${esc(TIERS[n].name)}</span><p class="small">${esc(TIERS[n].blurb)}</p><p class="small"><b>Approved by:</b> ${esc(TIERS[n].who)}</p>
      <p class="small"><b>Needs:</b> ${ARTIFACTS.filter(a=>a[2]<=n).map(a=>esc(a[1])).join(", ")}</p><p class="small"><b>Risk review once live:</b> every ${TIERS[n].reviewMonths===3?"quarter":"year"}</p></div>`).join("")}</div>
    <p class="small muted">The tier comes from nine yes/no questions in each project. Any “yes” to one of Microsoft's three sensitive uses (life opportunities, physical or psychological harm, human rights) makes it Tier 3.</p></div></details>`;
  const v=$("v-projects");
  v.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{PJ.filter=b.dataset.f;renderRegister();});
  v.querySelectorAll("tr.click").forEach(r=>r.onkeydown=e=>{if(e.key==="Enter"){PJ.open=r.dataset.open;renderProjects();}});
  const np=$("newProj");if(np)np.onclick=()=>{PJ.creating=true;renderRegister();$("n_t").focus();};
  const nc=$("n_cancel");if(nc)nc.onclick=()=>{PJ.creating=false;renderRegister();};
  const nf=$("newForm");if(nf)nf.onsubmit=async e=>{e.preventDefault();const t=$("n_t").value.trim();if(!t)return;
    const p=PROJECT_BLANK();p.title=t;p.team=$("n_team").value;addHist(p,"Project created");const id=uid("pr");
    try{await put("projects",id,p);}catch(err){return;}
    PJ.creating=false;PJ.open=id;PJ.draft=null;PJ.dirty=false;renderProjects();fillNames(v);window.scrollTo(0,0);toast("Project created. Start with the intake.");};
}

/* ============================================================
   PROJECTS: detail (one editable draft, saved after a pause)
   ============================================================ */
function draft(){
  if(PJ.draft&&PJ.draft.id===PJ.open&&PJ.dirty)return PJ.draft;
  const p=D.projects.find(x=>x.id===PJ.open);if(!p)return null;
  PJ.draft=normProject(clone(p));return PJ.draft;
}
function saveSoon(){PJ.dirty=true;clearTimeout(PJ.timer);PJ.timer=setTimeout(flush,900);}
function flush(){
  clearTimeout(PJ.timer);if(!PJ.dirty||!PJ.draft)return PJ.saving;
  const snap=clone(PJ.draft);PJ.draft.example=false;snap.example=false;
  PJ.saving=PJ.saving.then(()=>put("projects",snap.id,snap)).then(()=>{if(PJ.draft&&PJ.draft.id===snap.id&&JSON.stringify(PJ.draft)===JSON.stringify(snap))PJ.dirty=false;}).catch(()=>{});
  return PJ.saving;
}
const getPath=(o,path)=>path.split(".").reduce((a,k)=>a==null?a:a[k],o);
function setPath(o,path,v){const ks=path.split(".");let t=o;ks.slice(0,-1).forEach(k=>{if(t[k]==null||typeof t[k]!=="object")t[k]={};t=t[k];});t[ks[ks.length-1]]=v;}
function inp(path,label,o){o=o||{};const p=PJ.draft,val=getPath(p,path)??"",dis=D.canWrite?"":" disabled";
  const id="k_"+path.replace(/\./g,"_"),hint=o.hint?`<span class="hint">${o.hint}</span>`:"";
  const el=o.area?`<textarea id="${id}" data-k="${path}" rows="${o.rows||3}" placeholder="${esc(o.ph||"")}"${dis}>${esc(val)}</textarea>`
   :o.select?`<select id="${id}" data-k="${path}"${dis}>${o.select.map(([v,l])=>`<option value="${esc(v)}"${String(v)===String(val)?" selected":""}>${esc(l)}</option>`).join("")}</select>`
   :`<input id="${id}" data-k="${path}" value="${esc(o.money&&num(val)?money(val):val)}" placeholder="${esc(o.ph||"")}"${o.money?' inputmode="decimal" data-money="1"':""}${o.type?` type="${o.type}"`:""}${dis}>`;
  return `<div class="field"${o.wide?' style="grid-column:1/-1"':""}><label for="${id}">${label}</label>${hint}${el}</div>`;}

function renderProject(){
  const p=draft();if(!p){PJ.open=null;return renderRegister();}
  const st=pstatus(p),t=st.t,g=gate(p,st),si=STAGES.indexOf(p.stage);
  const need=k=>st.required.includes(k);
  const secs=ARTIFACTS.map(([k,l,min])=>`<a href="#a-${k}" class="${st.done[k]?"ok":need(k)?"req":"na"}"><span class="c">${st.done[k]?"✓":""}</span><span>${esc(l)}${need(k)?"":" <small class='muted'>(optional)</small>"}</span></a>`).join("");
  $("v-projects").innerHTML=`
  <div class="row"><button class="btn plain" type="button" id="backReg">← All projects</button><span class="push"></span>
    <button class="btn dark sm" type="button" id="packPdf">Download governance pack (PDF)</button></div>
  ${p.example?`<div class="banner">This is an example project so you can see what a complete one looks like. Editing it turns it into a real one.</div>`:""}
  <div class="stack">
    ${D.canWrite?`<input class="search" style="font-size:24px;font-weight:700;max-width:none;border-width:0 0 2px 0;border-radius:0;padding:4px 0" data-k="title" id="k_title" value="${esc(p.title)}" placeholder="Project name" aria-label="Project name">`:`<h2>${esc(p.title)}</h2>`}
    <div class="grid2">${inp("team","Owning team",{select:(cfg().teams||DEFAULT_TEAMS).map(x=>[x,x])})}${inp("sponsor","Executive sponsor",{ph:"e.g. VP Customer Success"})}
      <div class="field"><span class="label" style="font-weight:700;font-size:14px">Risk tier</span><span id="tierTag">${t.complete?`<span class="tag t${t.tier}">${esc(TIERS[t.tier].name)}</span>`:'<span class="small muted">Answer the risk questions below</span>'}</span></div>
      <div class="field"><span style="font-weight:700;font-size:14px">Started by</span><span class="small">${who(p.by)} · ${fmtDate(p.created)}</span></div></div>
    <div class="stepper">${STAGES.map((s,i)=>`<span class="${i<si?"done":i===si?"now":""}">${esc(s)}</span>`).join("")}</div>
    <div class="gate" id="pGate">${gateHTML(p,g)}</div>
  </div>
  <div class="proj">
    <nav class="pnav" id="pnav"><span class="lbl">Paperwork for Tier ${t.tier}</span>${secs}<a href="#a-history"><span class="c">≡</span><span>Audit trail</span></a></nav>
    <div class="stack" id="pbody">${sectionsHTML(p,st)}</div>
  </div>`;
  wireProject();
}
function gateHTML(p,g){
  if(!g.to)return `<b>${esc(g.wait)}</b>${D.admin&&p.stage!=="Closed"?"":""}${adminStageHTML(p)}`;
  const ok=g.needs.every(n=>n[1]);
  return `<b>To move to ${esc(g.to)}:</b><ul>${g.needs.map(n=>`<li class="${n[1]?"ok":""}">${esc(n[0])}</li>`).join("")}</ul>
    ${D.canWrite?`<div class="row"><button class="btn ${ok?"red":""}" type="button" id="advance"${ok?"":" disabled"}>Move to ${esc(g.to)}</button></div>`:""}${adminStageHTML(p)}`;
}
function adminStageHTML(p){return D.admin?`<details class="small" style="margin-top:4px"><summary class="muted">Admin: set stage directly</summary><div class="row" style="margin-top:6px"><select id="setStage">${STAGES.map(s=>`<option${s===p.stage?" selected":""}>${esc(s)}</option>`).join("")}</select><button class="btn sm" type="button" id="setStageGo">Set</button></div></details>`:"";}
function art(k,title,sub,body,st){return `<section class="art" id="a-${k}"><header><h3>${title}</h3>${st&&st.done[k]?'<span class="tag st">Done ✓</span>':st&&!st.required.includes(k)?'<span class="tag t1">Optional for this tier</span>':'<span class="tag warn">To do</span>'}<p>${sub}</p></header>${body}</section>`;}
function sectionsHTML(p,st){
  const t=st.t,ir=st.ir,V=VERDICT_TEXT[ir.v],dis=D.canWrite?"":" disabled";
  const intake=`<div class="grid2">${inp("intake.people","How many people do this task today?",{ph:"e.g. 6"})}${inp("intake.hours","Hours each, per week",{ph:"e.g. 5"})}</div>
    ${IDEA_QS.map((q,i)=>`<div class="qq"><p class="t"><span>${i+1}</span>${esc(q.q)}</p><div class="choices">${q.o.map((o,k)=>`<label class="choice${p.intake.a[q.id]===k?" on":""}"><input type="radio" name="iq-${q.id}" data-k="intake.a.${q.id}" data-v="${k}"${p.intake.a[q.id]===k?" checked":""}${dis}><span>${esc(o[0])}</span></label>`).join("")}</div></div>`).join("")}
    <div id="pIdea">${ideaHTML(ir)}</div>`;
  const risk=RISK_QS.map((q,i)=>`${i===0||RISK_QS[i-1].group!==q.group?`<p class="eyebrow" style="margin-top:${i?14:0}px">${q.group==="Sensitive use"?"Microsoft sensitive uses (any yes makes it Tier 3)":"Screening"}</p>`:""}<div class="yn"><p>${esc(q.q)}<small>Principle: ${esc(q.p)}</small>${p.risk[q.id]===true?`<small><b>Needs:</b> ${esc(q.control)}</small>`:""}</p><span class="seg2" role="group" aria-label="${esc(q.q)}"><button type="button" data-yn="${q.id}" data-v="1" aria-pressed="${p.risk[q.id]===true}"${dis}>Yes</button><button type="button" data-yn="${q.id}" data-v="0" aria-pressed="${p.risk[q.id]===false}"${dis}>No</button></span></div>`).join("")
    +`<div class="tierbox t${t.tier}"><h3>${t.complete?esc(TIERS[t.tier].name):"Answer all seven to set the tier"}</h3>${t.complete?`<p>${esc(TIERS[t.tier].blurb)}</p><p><b>Approved by:</b> ${esc(TIERS[t.tier].who)}</p>${t.yes.length?`<ul>${t.yes.map(q=>`<li>${esc(q.control)}</li>`).join("")}</ul>`:""}`:""}</div>`;
  const b=p.brief;
  const brief=`<div class="briefgrid"><div class="stack">
      ${inp("brief.ask","What are you asking them to approve?",{area:1,rows:2,hint:"One sentence, with the amount or scale.",ph:"Approve a 10-week pilot with 12 support agents, costing $60,000, to…"})}
      <div class="grid2">${inp("brief.decision","Type of decision",{select:DECISIONS.map(x=>[x,x])})}${inp("brief.decideBy","Decision needed by",{type:"date"})}</div>

      ${inp("brief.basis","How do you know the benefit?",{area:1,rows:2,hint:"A trial, a measurement, a quote. Be honest."})}

      <label class="choice${b.timeSaved?" on":""}"><input type="checkbox" data-k="brief.timeSaved" data-bool="1"${b.timeSaved?" checked":""}${dis}><span>Some of the benefit is <b>time saved</b></span></label>
      ${b.timeSaved?inp("brief.timeGoes","Where will that time go?",{area:1,rows:2,hint:"Hires you won't need, overtime that stops, or named work people move to."}):""}
      <div class="field"><span style="font-weight:700;font-size:14px">Milestones</span>${b.milestones.map((m,i)=>`<div class="minirow"><input data-ms="${i}" data-j="0" value="${esc(m[0])}" placeholder="Milestone" aria-label="Milestone"${dis}><input data-ms="${i}" data-j="1" value="${esc(m[1])}" placeholder="When" aria-label="When"${dis}><button class="x" type="button" data-rmms="${i}" aria-label="Remove">×</button></div>`).join("")}

        ${b.risks.length<5&&D.canWrite?`<div><button class="btn sm" type="button" data-add="rk">Add a risk</button></div>`:""}</div>
      ${inp("brief.success","How will we know it worked?",{area:1,rows:2})}
    </div><div class="stack"><div class="paper" id="paper">${paperHTML(p)}</div><div class="box" id="reviewBox">${reviewHTML(st.rv)}</div>
      <div class="row"><button class="btn red" type="button" id="briefPdf">Download brief (PDF)</button><button class="btn dark" type="button" id="briefCopy">Copy for email</button></div></div></div>`;
  const ap=st.ap;
  const approval=`${ap?`<div class="approval"><span class="small muted">Decision recorded ${fmtDate(ap.recordedAt)} by ${who(ap.by)}</span><span class="dec">${esc(DECISION_TYPES[ap.decision]||ap.decision)}</span>

     :`<div class="approval no"><span class="dec" style="color:var(--grey)">No decision yet</span><p class="small">${p.stage==="Awaiting approval"?`This is with ${esc(TIERS[t.tier].who)}.`:"Complete the brief and move the project to Awaiting approval."}</p></div>`}
    ${D.admin&&D.mode==="shared"&&p.by===D.me?`<div class="banner red">You started this project, so another board member should record the decision. Microsoft's governance guidance calls for reviewers who aren't involved in the work.</div>`:D.admin?`<form class="box grey" id="apForm"><h3>${ap?"Update the decision":"Record the decision"}</h3><p class="small muted">You're seeing this because you're on the AI review board (Editor access).</p>
      <div class="grid2"><div class="field"><label for="ap_d">Decision</label><select id="ap_d">${Object.entries(DECISION_TYPES).map(([k,l])=>`<option value="${k}"${ap&&ap.decision===k?" selected":""}>${esc(l)}</option>`).join("")}</select></div>

  const pilot=`<div class="grid2">${inp("pilot.passMark","Pass mark, written before the pilot starts",{area:1,rows:2,wide:1,hint:"The accuracy and time saving that would justify rolling it out. Setting it afterwards means it will pass by default.",ph:"e.g. 90% of drafts need only light edits; handle time down 15% or more"})}

      ${inp("pilot.result","Result",{select:[["","Not finished yet"],["pass","Passed"],["fail","Didn't pass"],["extend","Extended"]]})}

  const signoff=`<div class="grid2">${inp("signoff.privacy","Privacy reviewer",{ph:"Name"})}${inp("signoff.privacyDate","Date",{type:"date"})}

  const plannedQ=calc(p.brief).counted/4,tp=p.benefits.reduce((a,r)=>a+num(r.planned),0),ta=p.benefits.reduce((a,r)=>a+num(r.actual),0);

    ${p.benefits.length?p.benefits.map((r,i)=>`<tr><td><input data-bi="${i}" data-bf="period" value="${esc(r.period)}" aria-label="Quarter"${dis}></td><td><input class="r" data-bi="${i}" data-bf="planned" data-money="1" value="${num(r.planned)?money(r.planned):""}" aria-label="Planned"${dis}></td>

      <td><button class="x" type="button" data-rmb="${i}" aria-label="Remove">×</button></td></tr>`).join("")
      :`<tr><td colspan="5" class="small muted" style="padding:12px 6px">No quarters recorded yet.</td></tr>`}</tbody>
    <tfoot><tr><td>Total</td><td class="r">${money(tp)}</td><td class="r">${money(ta)}</td><td class="small">${tp?`${Math.round(ta/tp*100)}% of plan delivered`:""}</td><td></td></tr></tfoot></table></div>

      ${inp("review.lessons","What we'd tell the next team",{area:1,rows:2,wide:1})}

function ideaHTML(ir){const V=VERDICT_TEXT[ir.v];
  if(ir.answered<3)return `<p class="small muted">The verdict appears once you've answered a few questions.</p>`;
  return `<div class="verdict ${V.cls}"><span class="lbl">${ir.complete?"Idea check verdict":"Leaning towards"}</span><h3>${V.h}</h3><p>${V.p}</p></div>
    ${ir.issues.length?`<ul class="reasons">${ir.issues.map(x=>`<li><span>${esc(x)}</span></li>`).join("")}</ul>`:""}
    ${ir.hoursYr?`<p class="small muted">About ${fmtN(ir.hoursYr)} hours a year go into this task today.</p>`:""}`;}
function paperHTML(p){
  const b=p.brief,c=calc(b),T=(v,ph)=>v&&String(v).trim()?esc(v):`<span class="blank">${ph}</span>`;
  const ms=b.milestones.filter(m=>m[0].trim()),rk=b.risks.filter(r=>r[0].trim()),t=tierOf(p);
  const date=b.decideBy?new Date(b.decideBy+"T12:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}):"";
  return `<div class="rule"></div>
    <div><p class="kicker">Executive brief · ${esc(b.decision)}${date?" · decision by "+date:""}${t.complete?" · Tier "+t.tier:""}</p><h2 style="margin-top:4px">${T(p.title,"Project name")}</h2>
      <p class="by">Owner: ${T(p.team,"not set")} · Sponsor: ${T(p.sponsor,"not named")}</p></div>
    <div class="ask"><b>The ask</b><p>${T(b.ask,"What you want approved, in one sentence.")}</p></div>
    <div><h4>The problem</h4><p>${T(b.problem,"What goes wrong today, and how big it is.")}</p></div>
    <div><h4>What we'll do</h4><p>${T(b.plan,"What changes, in two or three sentences.")}</p></div>
    <div><h4>The numbers</h4><div class="nums">
      <div><span>One-time cost</span><b>${short$(c.once)}</b></div><div><span>Running / yr</span><b>${short$(c.running)}</b></div>
      <div><span>Benefit / yr${c.factor<1?` (at ${c.factor*100}%)`:""}</span><b>${short$(c.counted)}</b></div>
      <div><span>Net over 3 years</span><b class="${c.net3<0?"neg":""}">${short$(c.net3)}</b></div><div><span>Pays back</span><b>${c.payback?`Month ${c.payback}`:"Not in 3 yrs"}</b></div>
      <div><span>Confidence</span><b>${esc(b.conf)}</b></div></div>
      <p class="small" style="margin-top:6px">${(b.basis||"").trim()?"<b>Basis:</b> "+esc(b.basis):`<span class="blank">How you know the benefit.</span>`}</p>
      ${b.timeSaved?`<p class="small">${(b.timeGoes||"").trim()?"<b>Freed-up time goes to:</b> "+esc(b.timeGoes):`<span style="color:var(--red)"><b>Counts time saved with no plan for where it goes.</b></span>`}</p>`:""}</div>
    ${ms.length?`<div><h4>Timeline</h4><div class="tl">${ms.map(m=>`<div><span>${esc(m[1]||"TBC")}</span><p>${esc(m[0])}</p></div>`).join("")}</div></div>`:""}
    <div><h4>Risks</h4>${rk.length?`<ul>${rk.map(r=>`<li><b>${esc(r[0])}.</b> ${esc(r[1])}</li>`).join("")}</ul>`:`<p class="blank">The main risk and what you'll do about it.</p>`}</div>
    <div><h4>How we'll know it worked</h4><p>${T(b.success,"One or two measures.")}</p></div>
    <div><h4>If we don't do this</h4><p>${T(b.ifnot,"What happens if we do nothing.")}</p></div>
    <p class="foot-note">Benefits and running costs start in month ${c.start}. The three-year net counts ${c.factor===1?"the full benefit":`${c.factor*100}% of the stated benefit`}, minus all costs.</p>`;
}
function reviewHTML(items){const ok=items.filter(x=>x[0]).length;
  return `<div class="review"><h3>Brief check</h3><div class="score"><b>${ok} of ${items.length}</b><span class="muted">${ok===items.length?"Ready for the approvers.":"Fix the red items before it goes to an exec."}</span></div>
    <ul>${items.filter(x=>!x[0]).map(x=>`<li><span><b>${esc(x[1])}</b><br>${esc(x[2])}</span></li>`).join("")}${items.filter(x=>x[0]).map(x=>`<li class="ok"><span>${esc(x[1])}</span></li>`).join("")}</ul></div>`;}

/* Refresh the parts that depend on what's being typed, without touching the inputs. */
function refreshDerived(){
  const p=PJ.draft;if(!p)return;const st=pstatus(p);
  const set=(id,h)=>{const e=$(id);if(e)e.innerHTML=h;};
  set("pIdea",ideaHTML(st.ir));set("paper",paperHTML(p));set("reviewBox",reviewHTML(st.rv));
  set("pGate",gateHTML(p,gate(p,st)));wireGate();
  set("tierTag",st.t.complete?`<span class="tag t${st.t.tier}">${esc(TIERS[st.t.tier].name)}</span>`:'<span class="small muted">Answer the risk questions below</span>');
  document.querySelectorAll("#pnav a[href^='#a-']").forEach(a=>{const k=a.getAttribute("href").slice(3);if(!(k in st.done))return;
    a.className=st.done[k]?"ok":st.required.includes(k)?"req":"na";a.querySelector(".c").textContent=st.done[k]?"✓":"";});
  document.querySelectorAll(".art").forEach(s=>{const k=s.id.slice(2);if(!(k in st.done))return;const tg=s.querySelector("header .tag");
    if(tg){tg.className="tag "+(st.done[k]?"st":st.required.includes(k)?"warn":"t1");tg.textContent=st.done[k]?"Done ✓":st.required.includes(k)?"To do":"Optional for this tier";}});

function wireGate(){
  const a=$("advance");if(a)a.onclick=()=>{const p=PJ.draft,g=gate(p,pstatus(p));if(!g.to)return;const from=p.stage;p.stage=g.to;addHist(p,`Moved from ${from} to ${g.to}`);saveSoon();flush();renderProject();fillNames($("v-projects"));toast(`Moved to ${g.to}`);};
  const s=$("setStageGo");if(s)s.onclick=()=>{const p=PJ.draft,v=$("setStage").value;if(v===p.stage)return;addHist(p,`Stage set to ${v} by an admin (was ${p.stage})`);p.stage=v;saveSoon();flush();renderProject();fillNames($("v-projects"));};
}
function wireProject(){
  const v=$("v-projects"),p=PJ.draft;
  $("backReg").onclick=()=>{flush();PJ.open=null;PJ.confirmDel=false;renderProjects();fillNames(v);window.scrollTo(0,0);};
  $("packPdf").onclick=()=>{flush();governancePDF(PJ.draft);};
  wireGate();
  v.querySelectorAll("#pnav a").forEach(a=>a.onclick=e=>{e.preventDefault();const el=document.querySelector(a.getAttribute("href"));if(el)el.scrollIntoView({behavior:"smooth",block:"start"});});
  v.oninput=e=>{const el=e.target,p=PJ.draft;if(!p||!D.canWrite)return;
    if(el.dataset.k&&el.type!=="radio"&&el.type!=="checkbox"){setPath(p,el.dataset.k,el.dataset.money?num(el.value):el.value);}
    else if(el.dataset.ms!=null){p.brief.milestones[+el.dataset.ms][+el.dataset.j]=el.value;}
    else if(el.dataset.rk!=null){p.brief.risks[+el.dataset.rk][+el.dataset.j]=el.value;}
    else if(el.dataset.bi!=null){p.benefits[+el.dataset.bi][el.dataset.bf]=el.dataset.money?num(el.value):el.value;}
    else return;
    saveSoon();refreshDerived();};
  v.onchange=e=>{const el=e.target,p=PJ.draft;if(!p||!D.canWrite)return;
    if(el.type==="radio"&&el.dataset.k){setPath(p,el.dataset.k,+el.dataset.v);el.closest(".choices").querySelectorAll(".choice").forEach(c=>c.classList.toggle("on",c.contains(el)));saveSoon();refreshDerived();return;}
    if(el.dataset.bool){setPath(p,el.dataset.k,el.checked);saveSoon();renderProject();fillNames(v);return;}
    if(el.tagName==="SELECT"&&el.dataset.k){setPath(p,el.dataset.k,el.value);saveSoon();refreshDerived();}
    if(el.dataset.money){const n=num(el.value);el.value=n?money(n):"";}};
  v.onclick=e=>{const t=e.target.closest("button");if(!t||!D.canWrite)return;const p=PJ.draft;
    if(t.dataset.yn){p.risk[t.dataset.yn]=t.dataset.v==="1";const before=p._tier;saveSoon();renderProject();fillNames(v);
      const nt=tierOf(p);if(nt.complete)addHistOnce(p,`Risk tier set to ${nt.tier}`);return;}
    if(t.dataset.add==="ms"){p.brief.milestones.push(["",""]);}
    else if(t.dataset.add==="rk"){p.brief.risks.push(["",""]);}
    else if(t.dataset.add==="bq"){const q=nextQuarter(p.benefits);p.benefits.push({period:q,planned:Math.round(calc(p.brief).counted/4),actual:0,evidence:""});}
    else if(t.dataset.rmms!=null){p.brief.milestones.splice(+t.dataset.rmms,1);}
    else if(t.dataset.rmrk!=null){p.brief.risks.splice(+t.dataset.rmrk,1);}
    else if(t.dataset.rmb!=null){p.benefits.splice(+t.dataset.rmb,1);}
    else if(t.id==="briefPdf"){briefPDF(p);return;}
    else if(t.id==="briefCopy"){copyText(briefText(p),()=>toast("Copied. Paste it into an email."));return;}
    else if(t.id==="delProj"){$("delRow").innerHTML=`<span class="confirm">Delete “${esc(p.title||"this project")}” and its paperwork for everyone? <button class="btn sm" type="button" id="delYes">Delete</button><button class="btn sm plain" type="button" id="delNo">Keep it</button></span>`;return;}
    else if(t.id==="delYes"){const id=p.id;clearTimeout(PJ.timer);PJ.dirty=false;PJ.draft=null;PJ.open=null;
      del("projects",id).then(()=>{if(D.admin&&D.approvals.some(a=>a.id===id))return del("approvals",id);}).catch(()=>{});toast("Project deleted");renderProjects();return;}
    else if(t.id==="delNo"){renderProject();fillNames(v);return;}
    else return;
    saveSoon();renderProject();fillNames(v);};
  const af=$("apForm");if(af)af.onsubmit=async e=>{e.preventDefault();const p=PJ.draft,d=$("ap_d").value,t=tierOf(p).tier;
    const rec={decision:d,date:$("ap_date").value,conditions:$("ap_c").value.trim(),by:D.me,tier:t,recordedAt:new Date().toISOString(),project:p.title};
    try{await put("approvals",p.id,rec);}catch(err){return;}
    const to=d==="approved"||d==="conditions"?"Approved":d==="deferred"?"Assessed":"Closed";
    addHist(p,`Decision recorded: ${DECISION_TYPES[d]}${rec.conditions?" ("+rec.conditions+")":""}`);if(p.stage!==to){addHist(p,`Moved from ${p.stage} to ${to}`);p.stage=to;}
    saveSoon();await flush();renderProject();fillNames($("v-projects"));toast("Decision recorded");};
}
function addHistOnce(p,what){const h=p.history||[];if(h.length&&h[h.length-1].what===what)return;addHist(p,what);saveSoon();}
function nextQuarter(rows){const d=new Date();let y=d.getFullYear(),q=Math.floor(d.getMonth()/3)+1;

function pdfKit(J){

    doc.setDrawColor(LN[0],LN[1],LN[2]);doc.line(M,K.y,W-M,K.y);K.y+=5;};

  K.table=(cols,rows,widths)=>{const x=[M];widths.forEach((w,i)=>x.push(x[i]+w*CW));K.need(8);doc.setFont("helvetica","bold");doc.setFontSize(8);K.color(GRY);
    cols.forEach((c,i)=>doc.text(String(c),i>0&&typeof rows[0]?.[i]==="number"?x[i+1]-1:x[i],K.y,i>0&&typeof rows[0]?.[i]==="number"?{align:"right"}:{}));K.y+=4.5;
    rows.forEach(r=>{K.need(6);doc.setFont("helvetica","normal");doc.setFontSize(9);K.color(BLK);let hmax=1;
      r.forEach((v,i)=>{const isN=typeof v==="number",s=isN?(cols[i].includes("$")||cols[i].includes("value")||cols[i].includes("Benefit")||cols[i].includes("Delivered")?short$(v):fmtN(v)):String(v??"");
        if(isN)doc.text(s,x[i+1]-1,K.y,{align:"right"});else{const ls=doc.splitTextToSize(s,widths[i]*CW-2);doc.text(ls,x[i],K.y);hmax=Math.max(hmax,ls.length);}});
      K.y+=hmax*4+1.5;doc.setDrawColor(LN[0],LN[1],LN[2]);doc.line(M,K.y-3,W-M,K.y-3);});K.y+=2;};
  K.top=(kicker,title,sub)=>{doc.setFillColor(RED[0],RED[1],RED[2]);doc.rect(0,0,W,4,"F");K.y=16;K.text(kicker,8,GRY,true,2);K.text(title,19,BLK,true,1);K.text(sub,9,GRY,false,5);};
  return K;
}
async function briefPDF(p){

async function governancePDF(p){

  K.head("5. Pilot plan and result");K.kv("Pass mark",p.pilot.passMark||"Not set");K.kv("Dates",[p.pilot.start,p.pilot.end].filter(Boolean).join(" to "));K.kv("Result",{pass:"Passed",fail:"Didn't pass",extend:"Extended"}[p.pilot.result]||"Not finished");K.kv("What happened",p.pilot.actual);

  K.head("Audit trail");(p.history||[]).forEach(h=>K.kv(fmtDate(h.at),`${h.what} · ${nm(h.by)}`));

}

<script>
"use strict";

const svgEsc=esc;
function hbar(rows,o){
  /* rows: [{label, a, b?, note}] ; o: {fmt, names:[aName,bName]} */
  if(!rows.length)return `<p class="small muted">Nothing to show yet.</p>`;
  const two=rows.some(r=>r.b!=null),rowH=two?40:30,L=150,R=110,W=560,H=rows.length*rowH+8;
  const max=Math.max(1,...rows.map(r=>Math.max(r.a,r.b||0))),x=v=>L+(W-L-R)*v/max,bh=two?13:16;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${svgEsc(o.aria||"bar chart")}"><line class="bl" x1="${L}" x2="${L}" y1="0" y2="${H-4}"/>`;
  rows.forEach((r,i)=>{const y=4+i*rowH;
    s+=`<text class="cat" x="${L-8}" y="${y+(two?15:13)}" text-anchor="end">${svgEsc(r.label.length>17?r.label.slice(0,16)+"…":r.label)}</text>`;
    const bar=(v,yy,col,name)=>`<rect x="${L}" y="${yy}" width="${Math.max(v>0?2:0,x(v)-L)}" height="${bh}" rx="2" fill="${col}"><title>${svgEsc(r.label)}: ${svgEsc(name)} ${svgEsc(o.fmt(v))}</title></rect><text class="lb" x="${x(v)+6}" y="${yy+bh-2}">${svgEsc(o.fmt(v))}${!two&&r.note?`<tspan class="ax"> ${svgEsc(r.note)}</tspan>`:""}</text>`;
    s+=bar(r.a,y+2,"#111111",o.names[0]);
    if(two)s+=bar(r.b||0,y+2+bh+2,"#E4002B",o.names[1]);
    });
  return s+"</svg>";
}
function cols(rows,fmt){
  const W=560,H=210,L=44,B=26,T=18,pw=W-L-8,ph=H-T-B,max=Math.max(1,...rows.map(r=>r.v));
  const nice=v=>{const p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p;},top=nice(max),y=v=>T+ph-(v/top)*ph,step=pw/rows.length,bw=Math.min(46,step*.55);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Hours back a year, added each month">`;
  [0,top/2,top].forEach(v=>{s+=`<line class="${v?"gl":"bl"}" x1="${L}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-6}" y="${y(v)+4}" text-anchor="end">${fmtN(v)}</text>`;});
  rows.forEach((r,i)=>{const cx=L+step*i+step/2;
    if(r.v>0)s+=`<path d="M${cx-bw/2},${y(0)} V${y(r.v)+3} q0,-3 3,-3 H${cx+bw/2-3} q3,0 3,3 V${y(0)} Z" fill="#111111"><title>${svgEsc(r.label)}: ${fmtN(r.v)} hours a year</title></path>`;
    s+=`<text class="lb" x="${cx}" y="${y(r.v)-6}" text-anchor="middle">${r.v?fmtN(r.v):""}</text><text class="ax" x="${cx}" y="${H-8}" text-anchor="middle">${svgEsc(r.label)}</text>`;});
  return s+"</svg>";
}
function teamRows(){
  const teams=[...new Set([...(cfg().teams||DEFAULT_TEAMS),...D.people.map(p=>p.team).filter(Boolean)])];
  return teams.map(t=>{const ps=D.people.filter(p=>p.team===t),tr=ps.filter(p=>(p.done||[]).length>=LESSONS.length).length,
    w=D.wins.filter(x=>x.team===t);return {team:t,signed:ps.length,trained:tr,champions:ps.filter(p=>levelOf(p.id).lvl>=4).length,wins:w.length,hours:w.reduce((a,x)=>a+winHours(x),0)*countFactor()};});
}
function monthRows(){const out=[],now=new Date();
  for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1),k=d.getFullYear()+"-"+d.getMonth();
    out.push({label:d.toLocaleDateString("en-US",{month:"short"}),v:D.wins.filter(w=>{const c=new Date(w.created);return c.getFullYear()+"-"+c.getMonth()===k;}).reduce((a,w)=>a+winHours(w),0)*countFactor()});}
  return out;}
function projRows(){return D.projects.map(p=>normProject(clone(p))).filter(p=>p.benefits.length).map(p=>({label:p.title||"Untitled",a:p.benefits.reduce((s,r)=>s+num(r.planned),0),b:p.benefits.reduce((s,r)=>s+num(r.actual),0)}));}
function govStats(){const ps=D.projects.map(p=>normProject(clone(p)));const sts=ps.map(p=>[p,pstatus(p)]);
  return {complete:sts.filter(([p,st])=>st.required.filter(k=>k!=="review"&&k!=="benefits").every(k=>st.done[k])).length,t3:sts.filter(([p,st])=>st.t.complete&&st.t.tier===3).length,
    live:ps.filter(p=>p.stage==="Live").length,overdue:ps.filter(p=>(reviewDue(p)||{}).overdue).length};}
function renderValue(){
  const g=govStats(),s=stats(),c=cfg(),tr=teamRows().filter(t=>t.signed||t.wins),pr=projRows();
  const byStage=STAGES.map(st=>[st,D.projects.filter(p=>p.stage===st).length]);
  const wins=D.wins.slice().sort((a,b)=>(b.created||"").localeCompare(a.created||"")).slice(0,12);
  $("v-value").innerHTML=`
  <div class="head"><p class="eyebrow">Value</p><h2>Is AI paying off?</h2>
    <p>Adoption, time returned and project results in one place. Every number here comes from what people have logged in the portal, and the method is at the bottom of the page.</p></div>
  ${s.hasExamples?`<div class="banner red">Some of the entries here are examples, so the page isn't empty on day one. They're marked “Example”.${D.admin?` <button class="btn sm" type="button" id="clearEx" style="margin-left:8px">Remove example data</button>`:" A portal admin can remove them."}</div>`:""}
  <div class="row"><button class="btn red" type="button" id="qReport">Download quarterly value report (PDF)</button><button class="btn" type="button" id="csvWins">Wins (CSV)</button><button class="btn" type="button" id="csvProj">Projects (CSV)</button></div>
  <div class="stack"><h3>Adoption</h3><div class="pulse">
    <div><span>Signed in</span><b>${fmtN(s.signedIn)}</b><small>${Math.round(s.signedIn/s.headcount*100)}% of ${fmtN(s.headcount)} people</small></div>
    <div><span>Trained</span><b>${fmtN(s.trained)}</b><small>finished all ${LESSONS.length} lessons (${Math.round(s.trained/s.headcount*100)}%)</small></div>
    <div><span>Active, last 30 days</span><b>${fmtN(s.active)}</b><small>logged a win or a lesson</small></div>
    <div><span>Champions</span><b>${fmtN(s.champions)}</b><small>helping others learn</small></div></div></div>
  <div class="stack"><h3>Value</h3><div class="pulse">
    <div><span>Hours back a year</span><b>${fmtN(s.counted)}</b><small>${fmtN(s.reported)} reported, counted at ${Math.round(countFactor()*100)}%</small></div>
    <div><span>Worth, in people's time</span><b>${short$(s.value)}</b><small>at $${fmtN(num(c.rate))} an hour, a year</small></div>
    <div><span>Project benefit approved</span><b>${short$(s.planned)}</b><small>a year, confidence-adjusted</small></div>
    <div><span>Project benefit delivered</span><b>${short$(s.realized)}</b><small>to date, from benefits tracking</small></div></div>
    <p class="method">Hours back is time people have got back and reported. It's not a budget saving until it's put to other use, so the approved and delivered project numbers are the ones to hold teams to.</p></div>
  <div class="stack"><h3>Governance</h3><div class="pulse">
    <div><span>Projects with complete paperwork</span><b>${fmtN(g.complete)}</b><small>of ${fmtN(D.projects.length)} in the register</small></div>
    <div><span>Sensitive-use projects</span><b>${fmtN(g.t3)}</b><small>Tier 3 under Microsoft's standard</small></div>
    <div><span>Risk reviews overdue</span><b style="color:${g.overdue?"var(--red)":"inherit"}">${fmtN(g.overdue)}</b><small>of ${fmtN(g.live)} live projects</small></div>
    <div><span>Decisions on record</span><b>${fmtN(D.approvals.length)}</b><small>all recorded by the AI review board</small></div></div></div>
  <div class="charts">
    <div class="chart"><h3>Trained, by team</h3><p class="sub">People who finished all ${LESSONS.length} lessons. The grey figure is how many have signed in.</p>
      ${hbar(tr.map(t=>({label:t.team,a:t.trained,note:"of "+t.signed})),{fmt:fmtN,names:["trained"],aria:"People trained by team"})}</div>
    <div class="chart"><h3>Hours back a year, added each month</h3><p class="sub">From wins logged that month, counted at ${Math.round(countFactor()*100)}%.</p>${cols(monthRows())}</div>
    <div class="chart"><h3>Projects: planned against delivered</h3><p class="sub">Totals from each project's benefits tracking, same quarters only.</p>
      <div class="legend"><span><i style="background:#111111"></i>Planned</span><span><i style="background:#E4002B"></i>Delivered</span></div>
      ${hbar(pr,{fmt:short$,names:["planned","delivered"],aria:"Planned against delivered benefit by project"})}</div>
    <div class="chart"><h3>Project pipeline</h3><p class="sub">Where every project in the register is now.</p>
      <table class="reg" style="min-width:0"><tbody>${byStage.map(([st,n])=>`<tr><td>${esc(st)}</td><td class="r"><b>${n}</b></td></tr>`).join("")}</tbody></table>
      <button class="btn sm" type="button" data-go="projects" style="align-self:flex-start">Open the register</button></div>
  </div>
  <div class="box"><div class="row"><h3>Latest wins</h3>${D.canWrite?`<button class="btn sm red push" type="button" data-go="home">Log a win</button>`:""}</div>
    ${wins.length?`<ul class="feed">${wins.map(w=>`<li><span class="t">${esc(w.task)}${w.example?' <span class="tag ex">Example</span>':""}</span>
      <span class="m">${who(w.by)} · ${esc(w.team||"No team")} · ${fmtDate(w.created)}${w.prompt&&PROMPTS.find(p=>p.id===w.prompt)?` · used “${esc(PROMPTS.find(p=>p.id===w.prompt).t)}”`:""}</span>
      <span class="h">${fmtN(winHours(w))} hrs<small>a year, reported</small></span>${w.note?`<span class="n">“${esc(w.note)}”</span>`:""}</li>`).join("")}</ul>`
      :`<p class="muted">No wins logged yet. They show up here as soon as people start logging them.</p>`}</div>
  <details class="more"><summary>How these numbers are worked out</summary><div class="method">
    <p><b>Hours back a year</b> = minutes saved each time ÷ 60 × times a year (once = 1, monthly = 12, weekly = 46, most days = 220). People tend to overestimate time saved, so only ${Math.round(countFactor()*100)}% of the reported figure is counted. A portal admin can change that.</p>
    <p><b>Worth, in people's time</b> = counted hours × $${fmtN(num(c.rate))}, the loaded hourly cost. It shows the scale of the time returned, not cash saved.</p>
    <p><b>Project benefit approved</b> = each approved, piloting or live project's yearly benefit from its brief, cut by its confidence (Medium counts 75%, Low 50%).</p>
    <p><b>Project benefit delivered</b> = the actual figures project owners record each quarter, with evidence.</p>
    <p><b>Trained</b> = finished all ${LESSONS.length} lessons. <b>Active</b> = logged a win or completed a lesson in the last 30 days. <b>Champion</b> = Level 4.</p></div></details>
  ${D.admin?settingsHTML():""}`;
  const v=$("v-value");
  $("qReport").onclick=valueReportPDF;
  $("csvWins").onclick=()=>saveFile("ai-wins.csv",[csvRow(["Date","Team","Task","Minutes saved","How often","Hours a year (reported)","Prompt","Tip","Example"]),
    ...D.wins.map(w=>csvRow([w.created&&w.created.slice(0,10),w.team,w.task,w.mins,FREQ[w.freq]?FREQ[w.freq][0]:w.freq,Math.round(winHours(w)),w.prompt,w.note,w.example?"yes":""]))].join("\n"));
  $("csvProj").onclick=()=>saveFile("ai-projects.csv",[csvRow(["Project","Team","Sponsor","Stage","Risk tier","Benefit / yr (counted)","Planned to date","Delivered to date","Approval","Next step"]),
    ...D.projects.map(p=>{p=normProject(clone(p));const st=pstatus(p);return csvRow([p.title,p.team,p.sponsor,p.stage,st.t.complete?st.t.tier:"",Math.round(calc(p.brief).counted),
      p.benefits.reduce((a,r)=>a+num(r.planned),0),p.benefits.reduce((a,r)=>a+num(r.actual),0),st.ap?DECISION_TYPES[st.ap.decision]:"",nextStep(p,st)]);})].join("\n"));
  const ce=$("clearEx");if(ce)ce.onclick=()=>{ce.outerHTML=`<span class="confirm">Remove every example entry for everyone? <button class="btn sm" type="button" id="clearYes">Remove</button></span>`;
    $("clearYes").onclick=async()=>{for(const k of COLLS)for(const r of D[k].filter(x=>x.example)){try{await del(k,r.id);}catch(e){}}toast("Example data removed");};};
  const sf=$("setForm");if(sf)sf.onsubmit=async e=>{e.preventDefault();
    const teams=$("set_teams").value.split("\n").map(x=>x.trim()).filter(Boolean);
    const o={headcount:num($("set_head").value)||200,rate:num($("set_rate").value)||75,countPct:Math.min(100,Math.max(0,num($("set_pct").value))),teams:teams.length?teams:DEFAULT_TEAMS};
    try{await put("config","settings",o);toast("Settings saved");}catch(err){}};
}
function settingsHTML(){const c=cfg();
  return `<form class="box grey" id="setForm"><h3>Portal settings</h3><p class="small muted">Only portal admins (Editors) see this.</p>
    <div class="grid2"><div class="field"><label for="set_head">People in the company</label><input id="set_head" inputmode="numeric" value="${esc(c.headcount)}"></div>
    <div class="field"><label for="set_rate">Loaded cost per hour ($)</label><input id="set_rate" inputmode="decimal" value="${esc(c.rate)}"></div>
    <div class="field"><label for="set_pct">Count this % of reported time</label><input id="set_pct" inputmode="numeric" value="${esc(c.countPct)}"></div></div>
    <div class="field"><label for="set_teams">Teams, one per line</label><textarea id="set_teams" rows="6">${esc((c.teams||DEFAULT_TEAMS).join("\n"))}</textarea></div>
    <div class="row"><button class="btn dark" type="submit">Save settings</button></div></form>`;}
async function valueReportPDF(){
  let J;try{J=await loadJsPDF();}catch(e){toast("Couldn't load the PDF maker. Try again in a moment.");return;}
  const s=stats(),K=pdfKit(J),now=new Date(),q=Math.floor(now.getMonth()/3)+1;K.footer=`AI value report · Q${q} ${now.getFullYear()}`;
  K.top(`AI VALUE REPORT · Q${q} ${now.getFullYear()}`,"How AI is paying off",`Generated ${fmtDate(now.toISOString())} from the CONA AI Portal${s.hasExamples?" · includes example data":""}`);
  K.head("Headlines");
  K.text(`${fmtN(s.trained)} of ${fmtN(s.headcount)} people (${Math.round(s.trained/s.headcount*100)}%) have finished the AI basics, and ${fmtN(s.active)} were active in the last 30 days. People report getting back ${fmtN(s.reported)} hours a year; we count ${fmtN(s.counted)} of those (${Math.round(countFactor()*100)}%), worth about ${short$(s.value)} of people's time. Approved projects are expected to return ${short$(s.planned)} a year, and ${short$(s.realized)} has been delivered and evidenced so far.`,10.5,K.BLK,false,3);
  K.head("Adoption by team");const tr=teamRows().filter(t=>t.signed||t.wins);
  if(tr.length)K.table(["Team","Signed in","Trained","Champions","Wins","Hours/yr (counted)"],tr.map(t=>[t.team,t.signed,t.trained,t.champions,t.wins,t.hours]),[.34,.13,.13,.13,.1,.17]);else K.text("No sign-ins yet.",10,K.GRY);
  K.head("Projects");const ps=D.projects.map(p=>normProject(clone(p)));
  if(ps.length)K.table(["Project","Stage","Tier","Benefit/yr $","Delivered $"],ps.map(p=>{const st=pstatus(p);return [p.title||"Untitled",p.stage,st.t.complete?String(st.t.tier):"–",calc(p.brief).counted,p.benefits.reduce((a,r)=>a+num(r.actual),0)];}),[.4,.18,.08,.17,.17]);
  else K.text("No projects yet.",10,K.GRY);
  const gv=govStats();K.head("Governance");K.text(`${gv.complete} of ${D.projects.length} projects have complete paperwork for their tier. ${gv.t3} ${gv.t3===1?"is a sensitive use":"are sensitive uses"} (Tier 3) under Microsoft's Responsible AI Standard. ${gv.overdue} of ${gv.live} live projects ${gv.overdue===1?"has":"have"} an overdue risk review. ${D.approvals.length} decisions are on record. The process follows the Assess, Document, Enforce and Monitor steps of Microsoft's Cloud Adoption Framework for AI.`,10);
  K.head("Pipeline");K.text(STAGES.map(st=>`${st}: ${D.projects.filter(p=>p.stage===st).length}`).join(" · "),10);
  K.head("Recent wins");D.wins.slice().sort((a,b)=>(b.created||"").localeCompare(a.created||"")).slice(0,8).forEach(w=>K.text(`${w.task} (${w.team||"no team"}) · about ${fmtN(winHours(w))} hrs/yr reported${w.note?` · “${w.note}”`:""}`,9.5,K.BLK,false,1.5));
  K.head("Method");K.text(`Hours back = minutes saved ÷ 60 × times a year, self-reported, counted at ${Math.round(countFactor()*100)}%. Value of time = counted hours × $${fmtN(num(cfg().rate))}/hr; this is capacity, not cash. Project benefit approved = yearly benefit from each approved, piloting or live project's brief, cut by confidence (Medium 75%, Low 50%). Delivered = actuals recorded quarterly by project owners with evidence.`,8.5,K.GRY,false,0);
  K.foot(K.footer);saveFile(`ai-value-report-q${q}-${now.getFullYear()}.pdf`,K.doc.output("blob"));
}

go(VIEWS.includes(start)?start:"home",true);
