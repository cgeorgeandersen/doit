# Checks Cherokee Small Jobs (cherokee-small-jobs/) on every push to master and pull
# request that touches it: install, the estimate API's tests, and a type-checked
# production build. Hosting is on Vercel (see cherokee-small-jobs/vercel.json);
# this workflow does not deploy.
name: Cherokee Small Jobs

on:
  push:
    branches: [master]
    paths: ['cherokee-small-jobs/**', '.github/workflows/cherokee-small-jobs-ci.yml']
  pull_request:
    paths: ['cherokee-small-jobs/**', '.github/workflows/cherokee-small-jobs-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cherokee-small-jobs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cherokee-small-jobs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cherokee-small-jobs/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
