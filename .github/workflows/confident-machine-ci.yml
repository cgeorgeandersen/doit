# Checks The Confident Machine (confident-machine/) on every push and pull
# request that touches it: install, tests, fact freshness, production build.
# Hosting is on Vercel (see vercel.json). This workflow deliberately does not
# deploy to GitHub Pages, which this repository uses for a different site.
name: The Confident Machine

on:
  push:
    branches: [master]
    paths: ['confident-machine/**', 'vercel.json', '.github/workflows/confident-machine-ci.yml']
  pull_request:
    paths: ['confident-machine/**', 'vercel.json', '.github/workflows/confident-machine-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: confident-machine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: confident-machine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: confident-machine/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check:facts
      - run: npm run build
