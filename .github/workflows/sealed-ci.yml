# Checks Sealed (sealed/) on every push to master and pull request that touches it:
# install, tests, and a type-checked production build. Hosting is on Vercel
# (see sealed/vercel.json); this workflow does not deploy.
name: Sealed

on:
  push:
    branches: [master]
    paths: ['sealed/**', '.github/workflows/sealed-ci.yml']
  pull_request:
    paths: ['sealed/**', '.github/workflows/sealed-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sealed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sealed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sealed/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
