# Builds and tests The Confident Machine (confident-machine/) and publishes it
# to GitHub Pages. Enable Pages with "Source: GitHub Actions" in the repository
# settings. Pull requests are built and tested but not deployed.
name: The Confident Machine

on:
  push:
    branches: [master]
    paths: ['confident-machine/**', '.github/workflows/confident-machine-pages.yml']
  pull_request:
    paths: ['confident-machine/**', '.github/workflows/confident-machine-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: confident-machine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: confident-machine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: confident-machine/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check:facts
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: confident-machine/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
