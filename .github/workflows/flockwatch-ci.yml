# Checks Track the Pole (flockwatch/) on every push and pull request that touches
# it: install, tests, and a type-checked production build. It does not fetch
# camera data (Vercel does that at deploy time; see flockwatch/vercel.json),
# and it does not deploy.
name: Track the Pole

on:
  push:
    branches: [master]
    paths: ['flockwatch/**', '.github/workflows/flockwatch-ci.yml']
  pull_request:
    paths: ['flockwatch/**', '.github/workflows/flockwatch-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flockwatch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flockwatch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: flockwatch/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
