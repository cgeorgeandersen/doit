# Checks All Rise (all-rise/) on every push to master and pull request that
# touches it: install, tests, and a type-checked production build. Hosting is
# on Vercel (see all-rise/vercel.json); this workflow does not deploy.
name: All Rise

on:
  push:
    branches: [master]
    paths: ['all-rise/**', '.github/workflows/all-rise-ci.yml']
  pull_request:
    paths: ['all-rise/**', '.github/workflows/all-rise-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: all-rise-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: all-rise
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: all-rise/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
